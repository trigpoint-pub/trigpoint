<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Causes across three layers, data, training and inference, and decoding, each with its own mitigations and no single fix; beyond its reliable range the model tends not to say it does not know but keeps sampling fluently">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">The danger is not being wrong but being fluently wrong</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Ji et al. (2023)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="70" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="90" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">Data layer</text>
        <text x="138" y="110" text-anchor="middle" font-size="11" fill="#666d75">mainly source vs reference mismatch</text>
    
        <rect x="40" y="132" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="152" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">Training layer</text>
        <text x="138" y="172" text-anchor="middle" font-size="11" fill="#666d75">representation, exposure bias</text>
    
        <rect x="40" y="194" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">Decoding layer</text>
        <text x="138" y="234" text-anchor="middle" font-size="11" fill="#666d75">diverse sampling (conjectured)</text>
    
        <path d="M242 158 L276 158" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M276 158 l-7 -4 v8 z" fill="#495057"/>
    
        <rect x="282" y="120" width="176" height="76" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="370" y="144" text-anchor="middle" fill="#8a5a00" font-weight="600">Beyond its reliable range</text>
        <text x="370" y="164" text-anchor="middle" font-size="11.5" fill="#8a5a00">seldom “I do not know”</text>
        <text x="370" y="182" text-anchor="middle" font-size="11.5" fill="#8a5a00">it keeps sampling fluently</text>
    
        <path d="M464 158 L498 158" stroke="#8a5a00" stroke-width="1.5" fill="none"/>
        <path d="M498 158 l-7 -4 v8 z" fill="#8a5a00"/>
    
        <rect x="504" y="120" width="176" height="36" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="592" y="143" text-anchor="middle" font-size="11.5" fill="#212529">Intrinsic: contradicts source</text>
        <rect x="504" y="160" width="176" height="36" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="592" y="183" text-anchor="middle" font-size="11.5" fill="#212529">Extrinsic: unverifiable</text>
    
        <rect x="282" y="206" width="398" height="40" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="481" y="230" text-anchor="middle" font-size="11.5" fill="#495057">contradiction by comparison, omission by existence check</text>
    
        <rect x="40" y="266" width="640" height="46" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="286" text-anchor="middle" fill="#495057" font-weight="600">Each layer has mitigations; there is no single fix</text>
        <text x="360" y="304" text-anchor="middle" font-size="11.5" fill="#495057">change the evidence supply, the objective, the decoding; it narrows; never assume it is zero</text>
    
        <line x1="80" y1="334" x2="640" y2="334" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="352" font-size="11.5" fill="#666d75">The mechanism is conceptual and deliberately carries no rates: those change with dataset, task or model version.</text>
        <text x="80" y="370" font-size="11.5" fill="#666d75">Both types are defined relative to the source: change the source definition and the type changes.</text>
        <text x="80" y="388" font-size="11.5" fill="#666d75">The intrinsic and extrinsic split is inherited from earlier work, not proposed by this survey.</text>
        <text x="696" y="398" text-anchor="end" font-size="10.5" fill="#666d75">Figure: trigpoint.pub</text>
      </g>
    </svg>