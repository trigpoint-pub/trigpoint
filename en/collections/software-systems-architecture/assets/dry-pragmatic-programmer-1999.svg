<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four cases from two axes: whether two pieces of text are literally the same, and whether the intent behind them is the same; the principle treats only duplicated intent, and forcing together coincidental sameness is the common misuse">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">The target is duplicated intent, not duplicated text</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Hunt &amp; Thomas (1999, 2019)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="76" font-size="11.5" fill="#666d75">Vertical axis: the intent behind it</text>
        <text x="404" y="76" font-size="11.5" fill="#666d75">Horizontal axis: the text</text>
    
        <rect x="152" y="88" width="252" height="98" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="278" y="118" text-anchor="middle" fill="#495057" font-weight="600">Same knowledge, written differently</text>
        <text x="278" y="140" text-anchor="middle" font-size="11.5" fill="#495057">one rule across spec, prompt and docs</text>
        <text x="278" y="160" text-anchor="middle" font-size="11.5" fill="#495057">no textual overlap; a change will miss one</text>
        <text x="278" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#8a5a00">this is the cell the principle treats</text>
    
        <rect x="410" y="88" width="252" height="98" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="536" y="118" text-anchor="middle" fill="#495057" font-weight="600">Same knowledge, same wording</text>
        <text x="536" y="140" text-anchor="middle" font-size="11.5" fill="#495057">the most visible kind of duplication</text>
        <text x="536" y="160" text-anchor="middle" font-size="11.5" fill="#495057">collect it once and reference it</text>
        <text x="536" y="178" text-anchor="middle" font-size="11" fill="#666d75">the least effort to fix</text>
    
        <rect x="152" y="196" width="252" height="98" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="278" y="226" text-anchor="middle" fill="#495057" font-weight="600">Different knowledge, different wording</text>
        <text x="278" y="248" text-anchor="middle" font-size="11.5" fill="#666d75">two independent things</text>
        <text x="278" y="268" text-anchor="middle" font-size="11.5" fill="#666d75">no problem, no action needed</text>
    
        <rect x="410" y="196" width="252" height="98" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="536" y="226" text-anchor="middle" fill="#8a5a00" font-weight="600">Different knowledge, same wording</text>
        <text x="536" y="248" text-anchor="middle" font-size="11.5" fill="#8a5a00">alike by coincidence, one will change</text>
        <text x="536" y="268" text-anchor="middle" font-size="11.5" fill="#8a5a00">treating coincidence as structure</text>
        <text x="536" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#8a5a00">the common misuse lands here</text>
    
        <text x="40" y="130" font-size="11.5" fill="#495057">Same</text>
        <text x="40" y="238" font-size="11.5" fill="#495057">Different</text>
        <text x="220" y="312" text-anchor="middle" font-size="11.5" fill="#495057">Different</text>
        <text x="536" y="312" text-anchor="middle" font-size="11.5" fill="#495057">Same</text>
    
        <line x1="80" y1="336" x2="640" y2="336" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="356" font-size="11.5" fill="#666d75">The quadrants are conceptual: no proportions, areas or measured numbers.</text>
        <text x="80" y="374" font-size="11.5" fill="#666d75">One question places it: do these two exist for the same intent?</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">Figure: trigpoint.pub</text>
      </g>
    </svg>