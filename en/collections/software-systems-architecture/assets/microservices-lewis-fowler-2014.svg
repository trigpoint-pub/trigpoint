<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Monolith against services: on the left one change means releasing the whole package, on the right the unit of deployment and scaling becomes the service at the cost of distribution, with cross-service consistency no longer free">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">What splits is the deployment unit, not the coupling</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Lewis &amp; Fowler (2014)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="72" font-size="11.5" font-weight="600" fill="#495057">Monolith</text>
        <rect x="40" y="82" width="180" height="118" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <rect x="56" y="96" width="148" height="26" rx="3" fill="#ffffff" stroke="#dee2e6"/>
        <text x="130" y="114" text-anchor="middle" font-size="11" fill="#495057">Feature one</text>
        <rect x="56" y="128" width="148" height="26" rx="3" fill="#ffffff" stroke="#dee2e6"/>
        <text x="130" y="146" text-anchor="middle" font-size="11" fill="#495057">Feature two</text>
        <rect x="56" y="160" width="148" height="26" rx="3" fill="#ffffff" stroke="#dee2e6"/>
        <text x="130" y="178" text-anchor="middle" font-size="11" fill="#495057">Feature three</text>
        <text x="130" y="216" text-anchor="middle" font-size="11" fill="#666d75">change one place, release the lot</text>
        <text x="130" y="232" text-anchor="middle" font-size="11" fill="#666d75">scaling means duplicating all of it</text>
    
        <path d="M228 140 L262 140" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M262 140 l-7 -4 v8 z" fill="#495057"/>
    
        <text x="278" y="72" font-size="11.5" font-weight="600" fill="#495057">Split into services</text>
        <rect x="278" y="82" width="120" height="40" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="338" y="100" text-anchor="middle" font-size="11" fill="#212529">Service one</text>
        <text x="338" y="115" text-anchor="middle" font-size="10.5" fill="#666d75">own store</text>
        <rect x="278" y="128" width="120" height="40" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="338" y="146" text-anchor="middle" font-size="11" fill="#212529">Service two</text>
        <text x="338" y="161" text-anchor="middle" font-size="10.5" fill="#666d75">own store</text>
        <rect x="278" y="174" width="120" height="40" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="338" y="192" text-anchor="middle" font-size="11" fill="#212529">Service three</text>
        <text x="338" y="207" text-anchor="middle" font-size="10.5" fill="#666d75">own store</text>
        <text x="338" y="232" text-anchor="middle" font-size="11" fill="#666d75">released and scaled independently</text>
    
        <rect x="420" y="82" width="260" height="44" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="436" y="102" font-size="11.5" font-weight="600" fill="#495057">Gain: autonomy and local scaling</text>
        <text x="436" y="119" font-size="11" fill="#495057">organised around business capability</text>
    
        <rect x="420" y="134" width="260" height="44" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="436" y="154" font-size="11.5" font-weight="600" fill="#8a5a00">Pay: the full distributed cost</text>
        <text x="436" y="171" font-size="11" fill="#8a5a00">network, observability, debugging, deploys</text>
    
        <rect x="420" y="186" width="260" height="44" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="436" y="206" font-size="11.5" font-weight="600" fill="#8a5a00">Most underestimated: consistency</text>
        <text x="436" y="223" font-size="11" fill="#8a5a00">strong cross-service guarantees are gone</text>
    
        <rect x="40" y="250" width="640" height="46" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="270" text-anchor="middle" fill="#495057" font-weight="600">The same author's counsel: find a stable boundary with a monolith first</text>
        <text x="360" y="288" text-anchor="middle" font-size="11.5" fill="#495057">over-splitting is easy to spot: more time goes on the joins than on the content</text>
    
        <line x1="80" y1="318" x2="640" y2="318" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="336" font-size="11.5" fill="#666d75">The comparison is conceptual: no service counts, latencies or measured numbers.</text>
        <text x="80" y="354" font-size="11.5" fill="#666d75">The original says the term has no precise definition; its own is a leading candidate.</text>
        <text x="80" y="372" font-size="11.5" fill="#666d75">Discussed at a 2011 workshop, chosen as the name in 2012; not credited to the two authors.</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">Figure: trigpoint.pub</text>
      </g>
    </svg>