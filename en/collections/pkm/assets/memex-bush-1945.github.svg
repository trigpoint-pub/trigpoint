<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The associative trail mechanism: once knowledge outgrows hierarchical indexing, associative indexing lets any item pull up another, named trails branch and merge, and the endpoint is a web rather than a tree">
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

      <defs>
        <marker id="arr-mx" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#46608c"/></marker>
        <marker id="arr-mx-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
      </defs>
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">From slots to a web: associative trails</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Bush (1945)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <rect x="80" y="58" width="260" height="34" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="80" text-anchor="middle" fill="#212529">Knowledge outgrows retrieval</text>
        <line x1="210" y1="92" x2="210" y2="110" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-mx)"/>
        <rect x="80" y="114" width="260" height="34" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="136" text-anchor="middle" fill="#212529">Hierarchies fail: one item, one slot</text>
        <line x1="210" y1="148" x2="210" y2="166" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-mx)"/>
        <rect x="80" y="170" width="260" height="48" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="210" y="191" text-anchor="middle" fill="#212529" font-weight="600">Associative indexing</text>
        <text x="210" y="209" text-anchor="middle" fill="#212529">any item pulls up another at once</text>
        <line x1="210" y1="218" x2="210" y2="236" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-mx)"/>
        <rect x="80" y="240" width="260" height="34" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="262" text-anchor="middle" fill="#212529">Named trails: branch, merge, pass on</text>
        <line x1="210" y1="274" x2="210" y2="292" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-mx)"/>
        <rect x="80" y="296" width="260" height="34" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="318" text-anchor="middle" fill="#212529">A web, not a tree</text>
        <rect x="420" y="150" width="260" height="52" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-dasharray="4 3"/>
        <text x="550" y="172" text-anchor="middle" fill="#868e96">Contrast: library-style hierarchy</text>
        <text x="550" y="191" text-anchor="middle" fill="#868e96" font-size="11.5">drilling down fights how the mind associates</text>
        <rect x="420" y="286" width="260" height="52" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="550" y="308" text-anchor="middle" fill="#8a5a00">Lineage: Engelbart built, Nelson named</text>
        <text x="550" y="327" text-anchor="middle" fill="#8a5a00" font-size="11.5">eighty years on: the ancestor of linked notes</text>
        <path d="M 340 313 C 375 313, 385 313, 414 313" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-mx-a)"/>
        <line x1="80" y1="360" x2="640" y2="360" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="380" font-size="11.5" fill="#868e96">The Memex was never built: this is the first clear statement of the axiom, not a machine specification.</text>
        <text x="696" y="430" text-anchor="end" font-size="10.5" fill="#c9ccd2">Figure: trigpoint.pub</text>
      </g>
    </svg>