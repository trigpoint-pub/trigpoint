<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two axes producing four documentation types: practice against cognition crossed with learning against application, giving tutorial, how-to, reference and explanation">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">Two axes, four types kept apart</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Procida (diataxis.fr)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <text x="270" y="72" text-anchor="middle" fill="#868e96" font-size="11.5">Study (learning)</text>
        <text x="380" y="72" text-anchor="middle" fill="#868e96" font-size="11.5">←<tspan dx="11.5">→</tspan></text>
        <text x="490" y="72" text-anchor="middle" fill="#868e96" font-size="11.5">Work (applying)</text>
        <rect x="170" y="84" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="270" y="122" text-anchor="middle" fill="#212529" font-weight="600">tutorial</text>
        <text x="270" y="144" text-anchor="middle" fill="#495057" font-size="11.5">guided practice while learning</text>
        <rect x="390" y="84" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="490" y="122" text-anchor="middle" fill="#212529" font-weight="600">how-to guide</text>
        <text x="490" y="144" text-anchor="middle" fill="#495057" font-size="11.5">steps to a goal while working</text>
        <rect x="170" y="196" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="270" y="234" text-anchor="middle" fill="#212529" font-weight="600">explanation</text>
        <text x="270" y="256" text-anchor="middle" fill="#495057" font-size="11.5">understanding while learning</text>
        <rect x="390" y="196" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="490" y="234" text-anchor="middle" fill="#212529" font-weight="600">reference</text>
        <text x="490" y="256" text-anchor="middle" fill="#495057" font-size="11.5">information while working</text>
        <text x="140" y="130" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 140 130)">Practice (doing)</text>
        <text x="140" y="246" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 140 246)">Cognition (thinking)</text>
        <line x1="380" y1="88" x2="380" y2="292" stroke="#eceff1" stroke-width="1"/>
        <line x1="174" y1="190" x2="586" y2="190" stroke="#eceff1" stroke-width="1"/>
        <text x="380" y="318" text-anchor="middle" fill="#8a5a00" font-size="11.5">each type serves one reader need with its own writing rules: mixing them is why documentation degrades</text>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">The four names are verbatim from the primary site; this layout is indicative, not the site's own diagram.</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">Figure: trigpoint.pub</text>
      </g>
    </svg>