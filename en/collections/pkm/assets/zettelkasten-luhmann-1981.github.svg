<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The slip box mechanism: atomic cards, unique addresses, cross-references accumulating into a web, and the emergent layer Luhmann called a communication partner">
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

      <defs>
        <marker id="arr-zk" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#46608c"/></marker>
        <marker id="arr-zk-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
      </defs>
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">From atomic cards to a communication partner</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Luhmann (1981)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <rect x="80" y="58" width="260" height="34" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="80" text-anchor="middle" fill="#212529">Atomic cards: one idea per card</text>
        <line x1="210" y1="92" x2="210" y2="110" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-zk)"/>
        <rect x="80" y="114" width="260" height="34" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="136" text-anchor="middle" fill="#212529">Unique addresses: insertable anywhere</text>
        <line x1="210" y1="148" x2="210" y2="166" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-zk)"/>
        <rect x="80" y="170" width="260" height="34" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="192" text-anchor="middle" fill="#212529">Cross-references, never copies</text>
        <line x1="210" y1="204" x2="210" y2="222" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-zk)"/>
        <rect x="80" y="226" width="260" height="48" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="210" y="247" text-anchor="middle" fill="#212529" font-weight="600">A web accumulates</text>
        <text x="210" y="265" text-anchor="middle" fill="#212529">decades · a web, not a tree</text>
        <rect x="420" y="216" width="260" height="68" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="550" y="240" text-anchor="middle" fill="#8a5a00">Emergence: the system answers back</text>
        <text x="550" y="259" text-anchor="middle" fill="#8a5a00" font-size="11.5">old cards meet new questions unexpectedly</text>
        <text x="550" y="276" text-anchor="middle" fill="#8a5a00" font-size="11.5">(serendipity is manufactured)</text>
        <path d="M 340 250 C 370 250, 385 250, 414 250" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-zk-a)"/>
        <rect x="80" y="300" width="600" height="44" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-dasharray="4 3"/>
        <text x="380" y="319" text-anchor="middle" fill="#868e96" font-size="11.5">Three transferable choices: atomicity · unique addresses · cross-reference without copying</text>
        <text x="380" y="336" text-anchor="middle" fill="#868e96" font-size="11.5">drop any one and the web starts to rot</text>
        <line x1="80" y1="368" x2="640" y2="368" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="388" font-size="11.5" fill="#868e96">The figure of about ninety thousand cards is an approximation from archival reconstruction, not a census.</text>
        <text x="696" y="430" text-anchor="end" font-size="10.5" fill="#c9ccd2">Figure: trigpoint.pub</text>
      </g>
    </svg>