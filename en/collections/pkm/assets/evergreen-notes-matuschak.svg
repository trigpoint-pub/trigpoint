<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three disciplines of evergreen notes: one concept per node, organised by concept rather than source, densely linked, with notes maturing through revisits rather than rewrites">
      <defs>
        <marker id="arr-ev" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#46608c"/></marker>
        <marker id="arr-ev-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
      </defs>
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">Evergreen: matured, not written once</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Matuschak</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <rect x="80" y="62" width="260" height="40" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="80" text-anchor="middle" fill="#212529" font-weight="600">Atomic</text>
        <text x="210" y="96" text-anchor="middle" fill="#495057" font-size="11.5">one concept per note: a precise target to cite</text>
        <line x1="210" y1="102" x2="210" y2="120" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ev)"/>
        <rect x="80" y="124" width="260" height="40" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="142" text-anchor="middle" fill="#212529" font-weight="600">Organised by concept</text>
        <text x="210" y="158" text-anchor="middle" fill="#495057" font-size="11.5">not by source or topic</text>
        <line x1="210" y1="164" x2="210" y2="182" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ev)"/>
        <rect x="80" y="186" width="260" height="40" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="210" y="204" text-anchor="middle" fill="#212529" font-weight="600">Densely linked</text>
        <text x="210" y="220" text-anchor="middle" fill="#495057" font-size="11.5">links are first-class, not decoration</text>
        <line x1="210" y1="226" x2="210" y2="244" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ev)"/>
        <rect x="80" y="248" width="260" height="48" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="210" y="269" text-anchor="middle" fill="#212529" font-weight="600">Iterated over time</text>
        <text x="210" y="287" text-anchor="middle" fill="#212529">revisits mature a note, not rewrites</text>
        <rect x="420" y="230" width="260" height="66" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="550" y="254" text-anchor="middle" fill="#8a5a00">The test is two questions, not length:</text>
        <text x="550" y="272" text-anchor="middle" fill="#8a5a00" font-size="11.5">can it be linked alone and still mean?</text>
        <text x="550" y="289" text-anchor="middle" fill="#8a5a00" font-size="11.5">will another project use it in six months?</text>
        <path d="M 340 272 C 370 272, 385 268, 414 264" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-ev-a)"/>
        <text x="420" y="96" fill="#868e96" font-size="11.5">The three disciplines are the site's own</text>
        <text x="420" y="114" fill="#868e96" font-size="11.5">headings verbatim; a widely circulated</text>
        <text x="420" y="132" fill="#868e96" font-size="11.5">fourth principle does not exist there.</text>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">Individual-practitioner material: the corpus is public working notes, with no book or paper.</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">Figure: trigpoint.pub</text>
      </g>
    </svg>