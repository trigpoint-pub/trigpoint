<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three-zone Cornell page: a wide notes column for live capture, a narrow cue column filled in afterwards, and a summary band at the foot, driven by the five-step review loop">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">Three zones: capture apart from processing</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Pauk (1962)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <rect x="80" y="66" width="330" height="250" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
        <line x1="185" y1="66" x2="185" y2="256" stroke="#adb5bd" stroke-width="1"/>
        <line x1="80" y1="256" x2="410" y2="256" stroke="#adb5bd" stroke-width="1"/>
        <text x="132" y="96" text-anchor="middle" fill="#212529" font-weight="600" font-size="11.5">Cue column</text>
        <text x="132" y="116" text-anchor="middle" fill="#495057" font-size="11">filled afterwards:</text>
        <text x="132" y="133" text-anchor="middle" fill="#495057" font-size="11">questions, cues</text>
        <text x="132" y="153" text-anchor="middle" fill="#8a5a00" font-size="11">self-test triggers</text>
        <text x="297" y="96" text-anchor="middle" fill="#212529" font-weight="600" font-size="11.5">Notes column</text>
        <text x="297" y="116" text-anchor="middle" fill="#495057" font-size="11">live capture: points, examples</text>
        <text x="297" y="133" text-anchor="middle" fill="#495057" font-size="11">not tidy, just captured</text>
        <text x="245" y="285" fill="#212529" font-weight="600" font-size="11.5" text-anchor="middle">Summary band: the whole page in your own words</text>
        <g font-size="11.5">
          <text x="470" y="86" fill="#868e96">The five-step loop (this is the engine)</text>
          <text x="470" y="112" fill="#212529">1 Record: live in class</text>
          <text x="470" y="136" fill="#212529">2 Questions: cues, soon after</text>
          <text x="470" y="160" fill="#212529">3 Recite: cover, self-test</text>
          <text x="470" y="184" fill="#212529">4 Reflect: link to what you know</text>
          <text x="470" y="208" fill="#212529">5 Review: a short weekly pass</text>
          <path d="M 668 108 C 690 140, 690 176, 668 204" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4"/>
          <text x="470" y="240" fill="#8a5a00" font-size="11">three columns without the loop =</text>
          <text x="470" y="257" fill="#8a5a00" font-size="11">just ordinary notes</text>
        </g>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">The layout is scaffolding; the benefit comes from active recall and spaced review. Column widths are indicative.</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">Figure: trigpoint.pub</text>
      </g>
    </svg>