<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The trade between rate and reliability: capacity is a vertical line, to the left of which error can be driven arbitrarily low and past which error is unavoidable; below, the three factors that set capacity and one common misattribution">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">Capacity is a line, not a slope</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Shannon (1948, 1949)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="62" width="640" height="176" rx="4" fill="#ffffff" stroke="#dee2e6"/>
    
        <rect x="84" y="80" width="286" height="130" fill="#f8f9fa"/>
        <rect x="370" y="80" width="266" height="130" fill="#fdf3e0" opacity="0.55"/>
    
        <line x1="84" y1="210" x2="636" y2="210" stroke="#ced4da" stroke-width="1"/>
        <line x1="84" y1="80" x2="84" y2="210" stroke="#ced4da" stroke-width="1"/>
    
        <path d="M96 96 L340 100 Q362 102 370 118" stroke="#495057" stroke-width="2" fill="none"/>
        <path d="M370 118 Q382 150 404 176 T470 202" stroke="#8a5a00" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
    
        <line x1="370" y1="76" x2="370" y2="214" stroke="#8a5a00" stroke-width="1.5"/>
        <text x="370" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a00">Capacity</text>
    
        <text x="226" y="128" text-anchor="middle" font-size="12" fill="#495057" font-weight="600">Error can be driven arbitrarily low</text>
        <text x="226" y="146" text-anchor="middle" font-size="11" fill="#666d75">the price is coding and delay</text>
        <text x="510" y="128" text-anchor="middle" font-size="12" fill="#8a5a00" font-weight="600">Error is unavoidable</text>
        <text x="510" y="146" text-anchor="middle" font-size="11" fill="#8a5a00">no coding can recover it</text>
    
        <text x="88" y="76" font-size="11" fill="#666d75">Received accurately</text>
        <text x="636" y="228" text-anchor="end" font-size="11" fill="#666d75">faster and more</text>
    
        <rect x="40" y="252" width="412" height="64" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="246" y="274" text-anchor="middle" fill="#495057" font-weight="600">Capacity is set by three things together</text>
        <text x="246" y="294" text-anchor="middle" font-size="11.5" fill="#495057">bandwidth · noise · coding ability</text>
        <text x="246" y="310" text-anchor="middle" font-size="11" fill="#666d75">a fatter pipe without touching noise does not raise it proportionally</text>
    
        <rect x="464" y="252" width="216" height="64" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="572" y="274" text-anchor="middle" fill="#8a5a00" font-weight="600">A misattribution with a source</text>
        <text x="572" y="294" text-anchor="middle" font-size="11" fill="#8a5a00">capacity under noise is not from 1928</text>
        <text x="572" y="310" text-anchor="middle" font-size="11" fill="#8a5a00">that paper counted noiseless states</text>
    
        <line x1="80" y1="336" x2="640" y2="336" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="356" font-size="11.5" fill="#666d75">Curve and line show shape and regions only: no numerical scale, no units, no coordinates.</text>
        <text x="80" y="374" font-size="11.5" fill="#666d75">The line is asymptotically reachable; for short messages and real-time use the actual rate is generally lower.</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">Figure: trigpoint.pub</text>
      </g>
    </svg>