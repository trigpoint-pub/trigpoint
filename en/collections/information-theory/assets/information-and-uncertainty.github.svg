<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How information arises: a space of possibilities, an event, the rest ruled out, and the amount ruled out is the information; below, a four-cell chart showing that quantity of information and meaning are independent axes">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">Information is what got ruled out</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Shannon (1948) · Hartley (1928)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="76" fill="#495057" font-weight="600" font-size="13">Mechanism</text>
    
        <rect x="40" y="88" width="126" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="103" y="110" text-anchor="middle" fill="#212529">Possibility space</text>
        <text x="103" y="128" text-anchor="middle" font-size="11" fill="#666d75">not yet revealed</text>
    
        <path d="M172 114 L198 114" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M198 114 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="204" y="88" width="126" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="267" y="110" text-anchor="middle" fill="#212529">An event occurs</text>
        <text x="267" y="128" text-anchor="middle" font-size="11" fill="#666d75">one comes true</text>
    
        <path d="M336 114 L362 114" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M362 114 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="368" y="88" width="126" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="431" y="110" text-anchor="middle" fill="#212529">The rest ruled out</text>
        <text x="431" y="128" text-anchor="middle" font-size="11" fill="#666d75">possibilities narrow</text>
    
        <path d="M500 114 L526 114" stroke="#8a5a00" stroke-width="1.5" fill="none"/>
        <path d="M526 114 l-7 -4 v8 z" fill="#8a5a00"/>
    
        <rect x="532" y="88" width="148" height="52" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="606" y="110" text-anchor="middle" fill="#8a5a00" font-weight="600">Information appears</text>
        <text x="606" y="128" text-anchor="middle" font-size="11" fill="#8a5a00">= the amount ruled out</text>
    
        <text x="40" y="176" fill="#495057" font-weight="600" font-size="13">Neither axis decides the other</text>
    
        <line x1="196" y1="196" x2="196" y2="332" stroke="#ced4da" stroke-width="1"/>
        <line x1="196" y1="332" x2="628" y2="332" stroke="#ced4da" stroke-width="1"/>
        <text x="182" y="200" text-anchor="end" font-size="11" fill="#666d75">high information</text>
        <text x="182" y="330" text-anchor="end" font-size="11" fill="#666d75">low information</text>
        <text x="212" y="352" font-size="11" fill="#666d75">low meaning</text>
        <text x="628" y="352" text-anchor="end" font-size="11" fill="#666d75">high meaning</text>
    
        <rect x="208" y="196" width="196" height="60" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="306" y="222" text-anchor="middle" font-size="11.5" fill="#495057">a surprising claim that is wrong</text>
        <text x="306" y="240" text-anchor="middle" font-size="11" fill="#666d75">rules out a lot, worth nothing</text>
    
        <rect x="420" y="196" width="196" height="60" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="518" y="222" text-anchor="middle" font-size="11.5" fill="#495057">a surprising judgement that holds</text>
        <text x="518" y="240" text-anchor="middle" font-size="11" fill="#666d75">high on both axes, the rarest</text>
    
        <rect x="208" y="264" width="196" height="60" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="306" y="290" text-anchor="middle" font-size="11.5" fill="#495057">a long, predictable restatement</text>
        <text x="306" y="308" text-anchor="middle" font-size="11" fill="#666d75">word count is not information</text>
    
        <rect x="420" y="264" width="196" height="60" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="518" y="290" text-anchor="middle" font-size="11.5" fill="#495057">a well-known important fact</text>
        <text x="518" y="308" text-anchor="middle" font-size="11" fill="#666d75">meaningful, but rules out nothing</text>
    
        <text x="40" y="378" font-size="11.5" fill="#666d75">The four cells locate concepts, not measurements: no coordinates, proportions or quantitative claims here.</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">Figure: trigpoint.pub</text>
      </g>
    </svg>