<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The route a message travels from the outside world to a decision through perception, compression, reconstruction and decision, each station bounded by capacity and noise; no capacity number is marked anywhere in this figure">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">Every station loses something; none reports it</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Miller (1956) · Bartlett (1932) · Simon (1955)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="88" width="106" height="56" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="93" y="112" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">World</text>
        <text x="93" y="130" text-anchor="middle" font-size="11" fill="#666d75">everything</text>
    
        <path d="M152 116 L174 116" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M174 116 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="180" y="88" width="106" height="56" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="233" y="112" text-anchor="middle" font-size="11.5" fill="#212529" font-weight="600">Perception</text>
        <text x="233" y="130" text-anchor="middle" font-size="11" fill="#666d75">capacity bites</text>
    
        <path d="M292 116 L314 116" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M314 116 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="320" y="88" width="106" height="56" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="373" y="112" text-anchor="middle" font-size="11.5" fill="#212529" font-weight="600">Compression</text>
        <text x="373" y="130" text-anchor="middle" font-size="11" fill="#666d75">no original kept</text>
    
        <path d="M432 116 L454 116" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M454 116 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="460" y="88" width="106" height="56" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="513" y="112" text-anchor="middle" font-size="11.5" fill="#212529" font-weight="600">Reconstruction</text>
        <text x="513" y="130" text-anchor="middle" font-size="11" fill="#666d75">recall rebuilds</text>
    
        <path d="M572 116 L594 116" stroke="#8a5a00" stroke-width="1.5" fill="none"/>
        <path d="M594 116 l-7 -4 v8 z" fill="#8a5a00"/>
    
        <rect x="600" y="88" width="80" height="56" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="640" y="112" text-anchor="middle" font-size="11.5" fill="#8a5a00" font-weight="600">Decision</text>
        <text x="640" y="130" text-anchor="middle" font-size="11" fill="#8a5a00">seems sound</text>
    
        <line x1="233" y1="152" x2="233" y2="172" stroke="#8a5a00" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="373" y1="152" x2="373" y2="172" stroke="#8a5a00" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="513" y1="152" x2="513" y2="172" stroke="#8a5a00" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="373" y="190" text-anchor="middle" font-size="11" fill="#8a5a00">each station drops something, and not at random: it drifts toward the existing frame</text>
    
        <rect x="40" y="210" width="312" height="82" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="196" y="234" text-anchor="middle" fill="#8a5a00" font-weight="600">Why no capacity number appears here</text>
        <text x="196" y="256" text-anchor="middle" font-size="11.5" fill="#8a5a00">the author of that famous number himself</text>
        <text x="196" y="274" text-anchor="middle" font-size="11.5" fill="#8a5a00">suspected the sevens were a coincidence</text>
    
        <rect x="368" y="210" width="312" height="82" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="524" y="234" text-anchor="middle" fill="#495057" font-weight="600">The dispute is still live</text>
        <text x="524" y="256" text-anchor="middle" font-size="11.5" fill="#495057">control for chunking and rehearsal and it drops</text>
        <text x="524" y="274" text-anchor="middle" font-size="11.5" fill="#495057">picking a side in an open dispute is not honest either</text>
    
        <line x1="80" y1="314" x2="640" y2="314" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="334" font-size="11.5" fill="#666d75">The flow is conceptual; each station's loss is marked by existence and direction, never by amount.</text>
        <text x="80" y="352" font-size="11.5" fill="#666d75">The distortion has a direction, so it does not cancel: agreeing recollections are not independent evidence.</text>
        <text x="80" y="370" font-size="11.5" fill="#666d75">Calling the mind a channel borrows a structure to ask questions; it does not claim the theorems apply to neurons.</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">Figure: trigpoint.pub</text>
      </g>
    </svg>