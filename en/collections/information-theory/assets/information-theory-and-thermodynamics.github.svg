<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The ladder of energy cost in computation: the theoretical lower bound for erasing a bit at the bottom, reversible computation above it, and real hardware far above that, with only the order of the rungs and the existence of the gap marked">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">What costs energy is forgetting, not thinking</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Szilárd (1929) · Landauer (1961) · Bennett (1973)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="62" width="392" height="192" rx="4" fill="#ffffff" stroke="#dee2e6"/>
    
        <rect x="72" y="80" width="328" height="42" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="236" y="98" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">Real computing hardware</text>
        <text x="236" y="114" text-anchor="middle" font-size="11" fill="#666d75">far above the bound; the gap is large</text>
    
        <text x="236" y="140" text-anchor="middle" font-size="11" fill="#8a5a00">no multiple is marked: that figure is not verified here</text>
    
        <rect x="72" y="152" width="328" height="42" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="236" y="170" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">Reversible computation in principle</text>
        <text x="236" y="186" text-anchor="middle" font-size="11" fill="#666d75">without erasure, far below it in principle</text>
    
        <rect x="72" y="204" width="328" height="34" rx="3" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="236" y="226" text-anchor="middle" font-size="11.5" fill="#8a5a00" font-weight="600">Theoretical lower bound for erasing one bit</text>
    
        <line x1="56" y1="238" x2="56" y2="86" stroke="#ced4da" stroke-width="1"/>
        <path d="M56 86 l-4 7 h8 z" fill="#ced4da"/>
        <text x="48" y="164" text-anchor="middle" font-size="11" fill="#666d75" transform="rotate(-90 48 164)">Energy</text>
    
        <rect x="448" y="62" width="232" height="90" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="564" y="86" text-anchor="middle" fill="#495057" font-weight="600">The distinction that flips it</text>
        <line x1="468" y1="98" x2="660" y2="98" stroke="#dee2e6" stroke-width="1"/>
        <text x="564" y="120" text-anchor="middle" font-size="11.5" fill="#495057">holds only for irreversible operations</text>
        <text x="564" y="140" text-anchor="middle" font-size="11.5" fill="#495057">not directly for measurement or transfer</text>
    
        <rect x="448" y="164" width="232" height="90" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="564" y="188" text-anchor="middle" fill="#8a5a00" font-weight="600">Both sides, no verdict</text>
        <line x1="468" y1="200" x2="660" y2="200" stroke="#ecd3a8" stroke-width="1"/>
        <text x="564" y="222" text-anchor="middle" font-size="11.5" fill="#8a5a00">critics question its general proofs</text>
        <text x="564" y="242" text-anchor="middle" font-size="11.5" fill="#8a5a00">and whether it exorcises the demon</text>
    
        <rect x="40" y="272" width="640" height="48" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="294" text-anchor="middle" fill="#495057" font-weight="600">This shelf does exactly what the founder warned against</text>
        <text x="360" y="312" text-anchor="middle" font-size="11.5" fill="#495057">in a 1956 editorial he warned that use in other fields needs experiment, not borrowed words</text>
    
        <line x1="80" y1="340" x2="640" y2="340" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="360" font-size="11.5" fill="#666d75">The ladder marks order and the existence of a gap only: no multiple, no energy value, no units.</text>
        <text x="80" y="378" font-size="11.5" fill="#666d75">1929: checked against the translated full text; 1961 and 1973: abstracts only.</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">Figure: trigpoint.pub</text>
      </g>
    </svg>