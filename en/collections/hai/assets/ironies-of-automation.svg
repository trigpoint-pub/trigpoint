<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Causal structure of the ironies of automation: designers automate what they can, while residual tasks, skill decay and failed monitoring converge on the moment of takeover; the more successful the automation, the more training the operator needs">
      <defs>
        <marker id="arr-ioa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#46608c"/></marker>
        <marker id="arr-ioa-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
      </defs>
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">The causal structure of the ironies</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Bainbridge (1983)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <rect x="180" y="58" width="360" height="34" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="360" y="80" text-anchor="middle" fill="#212529">Design side: automate what you know how to automate</text>
        <line x1="300" y1="92" x2="140" y2="124" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ioa)"/>
        <line x1="360" y1="92" x2="360" y2="124" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ioa)"/>
        <line x1="420" y1="92" x2="580" y2="124" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ioa)"/>
        <rect x="30" y="128" width="200" height="54" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="130" y="150" text-anchor="middle" fill="#212529">Residual tasks: the hardest part</text>
        <text x="130" y="169" text-anchor="middle" fill="#868e96" font-size="11.5">beyond even the designer</text>
        <rect x="260" y="128" width="200" height="54" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="360" y="150" text-anchor="middle" fill="#212529">The human becomes a monitor</text>
        <text x="360" y="169" text-anchor="middle" fill="#868e96" font-size="11.5">skills decay when unused</text>
        <rect x="490" y="128" width="200" height="54" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="590" y="150" text-anchor="middle" fill="#212529">Sustained watch cannot last</text>
        <text x="590" y="169" text-anchor="middle" fill="#868e96" font-size="11.5">beyond the limits of attention</text>
        <line x1="130" y1="182" x2="290" y2="216" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ioa)"/>
        <line x1="360" y1="182" x2="360" y2="216" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ioa)"/>
        <line x1="590" y1="182" x2="430" y2="216" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ioa)"/>
        <rect x="150" y="220" width="420" height="54" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="360" y="242" text-anchor="middle" fill="#212529">The abnormal event: the moment of takeover</text>
        <text x="360" y="261" text-anchor="middle" fill="#868e96" font-size="11.5">it demands exactly the decayed skills, on top of the failed monitoring</text>
        <line x1="360" y1="274" x2="360" y2="302" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-ioa-a)"/>
        <rect x="120" y="306" width="480" height="54" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="360" y="328" text-anchor="middle" fill="#8a5a00" font-weight="600">The ultimate irony: the less a system needs human intervention</text>
        <text x="360" y="347" text-anchor="middle" fill="#8a5a00">the more training its operator requires</text>
        <line x1="80" y1="384" x2="640" y2="384" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="404" font-size="11.5" fill="#868e96">Redrawn argument sketch; the main claims are the first two ironies, the ultimate irony is downstream.</text>
        <text x="696" y="430" text-anchor="end" font-size="10.5" fill="#c9ccd2">Figure: trigpoint.pub</text>
      </g>
    </svg>