<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NASA-TLX structure: six dimensions in two groups, weighted through fifteen pairwise comparisons into a weighted average, or simplified to the direct-average RTLX">
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

      <defs>
        <marker id="arr-tlx" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#46608c"/></marker>
        <marker id="arr-tlx-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
      </defs>
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">Six dimensions, two scoring paths</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Hart &amp; Staveland (1988)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <rect x="40" y="62" width="220" height="126" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="60" y="86" fill="#212529" font-weight="600">Demands the task imposes</text>
        <line x1="60" y1="96" x2="240" y2="96" stroke="#eceff1" stroke-width="1"/>
        <text x="60" y="120" fill="#495057">· Mental demand</text>
        <text x="60" y="144" fill="#495057">· Physical demand</text>
        <text x="60" y="168" fill="#495057">· Temporal demand</text>
        <rect x="40" y="208" width="220" height="126" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="60" y="232" fill="#212529" font-weight="600">The person's side of the task</text>
        <line x1="60" y1="242" x2="240" y2="242" stroke="#eceff1" stroke-width="1"/>
        <text x="60" y="266" fill="#495057">· Performance (self-rated)</text>
        <text x="60" y="290" fill="#495057">· Effort</text>
        <text x="60" y="314" fill="#495057">· Frustration</text>
        <text x="40" y="362" fill="#868e96" font-size="11.5">Each dimension self-rated 0–100</text>
        <line x1="260" y1="125" x2="316" y2="176" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-tlx)"/>
        <line x1="260" y1="271" x2="316" y2="220" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-tlx)"/>
        <rect x="320" y="148" width="190" height="100" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="415" y="182" text-anchor="middle" fill="#212529" font-weight="600">15 pairwise comparisons</text>
        <text x="415" y="204" text-anchor="middle" fill="#495057" font-size="11.5">circle the bigger contributor</text>
        <text x="415" y="224" text-anchor="middle" fill="#495057" font-size="11.5">weights 0–5 per dimension</text>
        <line x1="510" y1="198" x2="556" y2="198" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-tlx)"/>
        <rect x="560" y="162" width="130" height="72" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="625" y="192" text-anchor="middle" fill="#212529" font-weight="600">Workload score</text>
        <text x="625" y="212" text-anchor="middle" fill="#868e96" font-size="11.5">weighted average</text>
        <path d="M 260 320 C 400 330, 540 300, 616 240" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-tlx-a)"/>
        <text x="330" y="352" fill="#8a5a00" font-size="11.5">RTLX: skip pairing and average the six (endorsed in Hart 2006)</text>
        <line x1="80" y1="384" x2="640" y2="384" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="404" font-size="11.5" fill="#868e96">Redrawn structure; measures self-reported perceived workload; the two scorings do not compare across studies.</text>
        <text x="696" y="430" text-anchor="end" font-size="10.5" fill="#c9ccd2">Figure: trigpoint.pub</text>
      </g>
    </svg>