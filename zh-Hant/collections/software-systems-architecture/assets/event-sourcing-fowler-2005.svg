<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="上下對照示意：上為覆寫式只存當前狀態，歷史隨覆寫消失；下為事件逐筆疊加、當前狀態由重播得出，任何過去時點可重建。右側列出快照與對外副作用兩項麻煩之處">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">事實是那一串，現在的樣子是算出來的</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Fowler (2005)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="72" font-size="11.5" font-weight="600" fill="#8a5a00">覆寫式：只存現在</text>
        <rect x="40" y="82" width="76" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="78" y="104" text-anchor="middle" font-size="11.5" fill="#666d75">狀態 v1</text>
        <path d="M122 99 L146 99" stroke="#ecd3a8" stroke-width="1.5" fill="none"/>
        <path d="M146 99 l-7 -4 v8 z" fill="#ecd3a8"/>
        <rect x="152" y="82" width="76" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="190" y="104" text-anchor="middle" font-size="11.5" fill="#666d75">狀態 v2</text>
        <path d="M234 99 L258 99" stroke="#ecd3a8" stroke-width="1.5" fill="none"/>
        <path d="M258 99 l-7 -4 v8 z" fill="#ecd3a8"/>
        <rect x="264" y="82" width="76" height="34" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="302" y="104" text-anchor="middle" font-size="11.5" fill="#212529">狀態 v3</text>
        <text x="356" y="104" font-size="11.5" fill="#8a5a00">前兩格已被覆寫，取不回</text>
    
        <text x="40" y="156" font-size="11.5" font-weight="600" fill="#495057">事件溯源：逐筆疊加</text>
        <rect x="40" y="166" width="76" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="78" y="188" text-anchor="middle" font-size="11.5" fill="#495057">事件 1</text>
        <rect x="122" y="166" width="76" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="160" y="188" text-anchor="middle" font-size="11.5" fill="#495057">事件 2</text>
        <rect x="204" y="166" width="76" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="242" y="188" text-anchor="middle" font-size="11.5" fill="#495057">事件 3</text>
        <rect x="286" y="166" width="76" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-dasharray="4 3"/>
        <text x="324" y="188" text-anchor="middle" font-size="11.5" fill="#666d75">往後只加</text>
    
        <path d="M78 206 L78 232" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M324 206 L324 232" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M78 232 L324 232" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M201 232 L201 252" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M201 252 l-4 -7 h8 z" fill="#495057"/>
        <text x="212" y="248" font-size="11" fill="#495057">重播</text>
    
        <rect x="126" y="258" width="150" height="38" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="201" y="282" text-anchor="middle" fill="#212529">當前狀態（派生）</text>
    
        <rect x="396" y="150" width="284" height="52" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="412" y="172" fill="#8a5a00" font-weight="600">麻煩之處一：太長就要加快照</text>
        <text x="412" y="192" font-size="11.5" fill="#8a5a00">快照是加速，不是刪除原記錄</text>
    
        <rect x="396" y="212" width="284" height="66" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="412" y="234" fill="#8a5a00" font-weight="600">麻煩之處二：對外副作用不可重播</text>
        <text x="412" y="254" font-size="11.5" fill="#8a5a00">重播的語義是重讀既有事實</text>
        <text x="412" y="272" font-size="11.5" fill="#8a5a00">不是重跑一次</text>
    
        <line x1="80" y1="322" x2="640" y2="322" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="342" font-size="11.5" fill="#666d75">序列為概念示意，不含時間刻度、筆數或任何量測數字。</text>
        <text x="80" y="360" font-size="11.5" fill="#666d75">原文修正記錯的舊筆：把它與其後各筆反轉，再以更正後的事件重播。</text>
        <text x="80" y="378" font-size="11.5" fill="#666d75">原文至今掛作者本人之草稿聲明，本站照實標示。</text>
        <text x="696" y="394" text-anchor="end" font-size="10.5" fill="#666d75">圖：trigpoint.pub</text>
      </g>
    </svg>