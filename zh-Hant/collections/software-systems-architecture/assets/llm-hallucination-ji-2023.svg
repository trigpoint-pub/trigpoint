<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三層成因示意：資料層以來源與參考不一致為主、訓練與推論層有表徵學習與曝光偏差等、解碼端多樣性取樣與幻覺正相關；中段標出模型往往不說不知道而會繼續流暢取樣。刻意不含任何比率">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">危險不在錯，在錯得流暢</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Ji et al. (2023)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="70" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="90" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">資料層</text>
        <text x="138" y="110" text-anchor="middle" font-size="11" fill="#666d75">來源與參考不一致為主，另有重複</text>
    
        <rect x="40" y="132" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="152" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">訓練層</text>
        <text x="138" y="172" text-anchor="middle" font-size="11" fill="#666d75">表徵學習、曝光偏差、知識偏差</text>
    
        <rect x="40" y="194" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">解碼層</text>
        <text x="138" y="234" text-anchor="middle" font-size="11" fill="#666d75">多樣性取樣與幻覺正相關（推測）</text>
    
        <path d="M242 158 L276 158" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M276 158 l-7 -4 v8 z" fill="#495057"/>
    
        <rect x="282" y="120" width="176" height="76" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="370" y="144" text-anchor="middle" fill="#8a5a00" font-weight="600">超出可靠範圍時</text>
        <text x="370" y="164" text-anchor="middle" font-size="11.5" fill="#8a5a00">模型往往不說「我不知道」</text>
        <text x="370" y="182" text-anchor="middle" font-size="11.5" fill="#8a5a00">它會繼續流暢取樣</text>
    
        <path d="M464 158 L498 158" stroke="#8a5a00" stroke-width="1.5" fill="none"/>
        <path d="M498 158 l-7 -4 v8 z" fill="#8a5a00"/>
    
        <rect x="504" y="120" width="176" height="36" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="592" y="143" text-anchor="middle" font-size="11.5" fill="#212529">內在型：與來源矛盾</text>
        <rect x="504" y="160" width="176" height="36" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="592" y="183" text-anchor="middle" font-size="11.5" fill="#212529">外在型：來源無法驗證</text>
    
        <rect x="282" y="206" width="398" height="40" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="481" y="230" text-anchor="middle" font-size="11.5" fill="#495057">兩型查法不同：矛盾用比對抓，未提用存在性查核抓</text>
    
        <rect x="40" y="266" width="640" height="46" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="286" text-anchor="middle" fill="#495057" font-weight="600">三層各有緩解手段，沒有單點解</text>
        <text x="360" y="304" text-anchor="middle" font-size="11.5" fill="#495057">改變證據供給、改變訓練目標、約束解碼；只能收窄，不可假設已歸零</text>
    
        <line x1="80" y1="334" x2="640" y2="334" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="352" font-size="11.5" fill="#666d75">機制為概念示意，刻意不標任何幻覺率或比例：該類數字換資料集、任務或模型版本即換一組。</text>
        <text x="80" y="370" font-size="11.5" fill="#666d75">兩型皆相對於「來源內容」定義：換一個來源界定，類型會變。</text>
        <text x="80" y="388" font-size="11.5" fill="#666d75">內在／外在這組分類承襲前作，非該綜述所提出。</text>
        <text x="696" y="398" text-anchor="end" font-size="10.5" fill="#666d75">圖：trigpoint.pub</text>
      </g>
    </svg>