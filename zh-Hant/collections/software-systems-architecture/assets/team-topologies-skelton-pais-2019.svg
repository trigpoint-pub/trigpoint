<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="左為分工軸四種團隊型態，右為關係軸三種互動模式，並標出關係應隨時間由共探降級為服務式消費；底部為認知負荷邊界判準">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">兩軸分開宣告，而且關係那一軸會變</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Skelton &amp; Pais (2019)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="72" font-size="11.5" font-weight="600" fill="#495057">分工軸：四種型態</text>
    
        <rect x="40" y="82" width="290" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="56" y="104" font-size="11.5" fill="#495057">直接對齊一條價值流</text>
        <rect x="40" y="122" width="290" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="56" y="144" font-size="11.5" fill="#495057">專門提升別人的能力</text>
        <rect x="40" y="162" width="290" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="56" y="184" font-size="11.5" fill="#495057">負責高難度的子系統</text>
        <rect x="40" y="202" width="290" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="56" y="224" font-size="11.5" fill="#495057">把共用能力做成可自助取用的平台</text>
    
        <text x="380" y="72" font-size="11.5" font-weight="600" fill="#495057">關係軸：三種模式</text>
    
        <rect x="380" y="82" width="300" height="44" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="396" y="102" font-size="11.5" font-weight="600" fill="#8a5a00">高頻共同探索</text>
        <text x="396" y="119" font-size="11" fill="#8a5a00">給發現期用：邊界還沒摸清楚</text>
    
        <path d="M530 130 L530 148" stroke="#8a5a00" stroke-width="1.5" fill="none"/>
        <path d="M530 148 l-4 -7 h8 z" fill="#8a5a00"/>
        <text x="542" y="145" font-size="11" fill="#8a5a00">收斂後降級</text>
    
        <rect x="380" y="152" width="300" height="44" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="396" y="172" font-size="11.5" font-weight="600" fill="#212529">做成服務讓對方自助取用</text>
        <text x="396" y="189" font-size="11" fill="#495057">固化成：給這樣的輸入，回這樣的輸出</text>
    
        <rect x="380" y="202" width="300" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="396" y="224" font-size="11.5" fill="#495057">一方協助另一方建立能力</text>
    
        <rect x="40" y="252" width="640" height="46" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="272" text-anchor="middle" fill="#495057" font-weight="600">邊界判準：認知負荷</text>
        <text x="360" y="290" text-anchor="middle" font-size="11.5" fill="#495057">一個團隊能真正持有的範圍有上限；超載本身就是拆分訊號，不是意志力問題</text>
    
        <line x1="80" y1="320" x2="640" y2="320" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="338" font-size="11.5" fill="#666d75">分類為概念示意，不含人數、時程或任何量測數字。</text>
        <text x="80" y="356" font-size="11.5" fill="#666d75">分類法不是演算法：何時該降級，要靠判斷。</text>
        <text x="80" y="374" font-size="11.5" fill="#666d75">協作宣告文件之名為引入或推廣，本站不宣稱造詞。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">圖：trigpoint.pub</text>
      </g>
    </svg>