<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="碎片化代價的適用邊界定性示意：只在被系統設計所迫且跨生態格式的分裂觸發；同一基座內的自願多檔分流不觸發">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">碎片化代價：只咬一格</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Bergman &amp; Whittaker (2016)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <text x="395" y="72" text-anchor="middle" fill="#868e96" font-size="11.5">同一基座（如同一筆記庫）　　←　　→　　跨生態／跨格式（文件、郵件、書籤各一處）</text>
        <rect x="200" y="84" width="190" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="295" y="122" text-anchor="middle" fill="#212529">自願 × 同基座</text>
        <text x="295" y="144" text-anchor="middle" fill="#495057" font-size="11.5">多檔分流：不觸發</text>
        <rect x="410" y="84" width="190" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="505" y="122" text-anchor="middle" fill="#212529">自願 × 跨生態</text>
        <text x="505" y="144" text-anchor="middle" fill="#495057" font-size="11.5">自選分工：原命題不咬</text>
        <rect x="200" y="196" width="190" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="295" y="234" text-anchor="middle" fill="#212529">被迫 × 同基座</text>
        <text x="295" y="256" text-anchor="middle" fill="#495057" font-size="11.5">罕見組合：原命題不咬</text>
        <rect x="410" y="196" width="190" height="100" rx="4" fill="#fdf3e0" stroke="#ecd3a8" stroke-width="1.4"/>
        <text x="505" y="230" text-anchor="middle" fill="#8a5a00" font-weight="600">被迫 × 跨生態</text>
        <text x="505" y="252" text-anchor="middle" fill="#8a5a00" font-size="11.5">碎片化代價在此觸發</text>
        <text x="505" y="270" text-anchor="middle" fill="#8a5a00" font-size="11.5">（設計迫使的格式分裂）</text>
        <text x="170" y="130" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 170 130)">自願分流</text>
        <text x="170" y="252" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 170 252)">設計所迫</text>
        <line x1="400" y1="88" x2="400" y2="292" stroke="#eceff1" stroke-width="1"/>
        <line x1="204" y1="190" x2="596" y2="190" stroke="#eceff1" stroke-width="1"/>
        <text x="395" y="318" text-anchor="middle" fill="#495057" font-size="11.5">另一發現：對個人資料，自己整理的結構在檢索上勝過純搜尋（人有空間、時間與功能記憶）。</text>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">定性示意，無量測值；「被迫」為對原文 format-related／design-encouraged 之轉述（示意重繪）。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">圖：trigpoint.pub</text>
      </g>
    </svg>