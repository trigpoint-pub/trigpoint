<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diátaxis 兩軸推導四型：實作對認知乘學習對應用，落出 tutorial、how-to、reference、explanation 四格">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">兩軸推導，四型分開維護</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Procida (diataxis.fr)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <text x="270" y="72" text-anchor="middle" fill="#868e96" font-size="11.5">學習時（在學）</text>
        <text x="380" y="72" text-anchor="middle" fill="#868e96" font-size="11.5">←　→</text>
        <text x="490" y="72" text-anchor="middle" fill="#868e96" font-size="11.5">工作時（在用）</text>
        <rect x="170" y="84" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="270" y="122" text-anchor="middle" fill="#212529" font-weight="600">tutorial 教程</text>
        <text x="270" y="144" text-anchor="middle" fill="#495057" font-size="11.5">學習中的實作引導</text>
        <rect x="390" y="84" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="490" y="122" text-anchor="middle" fill="#212529" font-weight="600">how-to 指南</text>
        <text x="490" y="144" text-anchor="middle" fill="#495057" font-size="11.5">工作中的目標達成步驟</text>
        <rect x="170" y="196" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="270" y="234" text-anchor="middle" fill="#212529" font-weight="600">explanation 解說</text>
        <text x="270" y="256" text-anchor="middle" fill="#495057" font-size="11.5">學習中求理解</text>
        <rect x="390" y="196" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="490" y="234" text-anchor="middle" fill="#212529" font-weight="600">reference 參考</text>
        <text x="490" y="256" text-anchor="middle" fill="#495057" font-size="11.5">工作中查資訊</text>
        <text x="140" y="130" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 140 130)">實作（做）</text>
        <text x="140" y="246" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 140 246)">認知（想）</text>
        <line x1="380" y1="88" x2="380" y2="292" stroke="#eceff1" stroke-width="1"/>
        <line x1="174" y1="190" x2="586" y2="190" stroke="#eceff1" stroke-width="1"/>
        <text x="380" y="318" text-anchor="middle" fill="#8a5a00" font-size="11.5">每型服務一種讀者需求，各有獨立寫作準則：混寫是文件品質劣化的結構性成因。</text>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">四型名稱為 primary 站逐字；本圖佈局為示意，非原站圖版（示意重繪）。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">圖：trigpoint.pub</text>
      </g>
    </svg>