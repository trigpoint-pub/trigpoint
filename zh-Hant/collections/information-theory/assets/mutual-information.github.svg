<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="兩變數不確定性分解帶：左段為知道對方後 X 仍剩的部分，中段為共享資訊，右段為知道對方後 Y 仍剩的部分；下方對照互信息與相關係數的差別">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">中間那段，就是知道一個之後另一個少掉的</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Shannon (1948) · Fano (1961)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="80" font-size="11" fill="#666d75">兩者合起來的總不確定性</text>
        <line x1="40" y1="90" x2="680" y2="90" stroke="#ced4da" stroke-width="1"/>
        <line x1="40" y1="86" x2="40" y2="94" stroke="#ced4da" stroke-width="1"/>
        <line x1="680" y1="86" x2="680" y2="94" stroke="#ced4da" stroke-width="1"/>
    
        <rect x="40" y="104" width="228" height="58" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="154" y="128" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">知道 Y 之後</text>
        <text x="154" y="148" text-anchor="middle" font-size="11.5" fill="#495057">X 仍剩下的不確定</text>
    
        <rect x="268" y="104" width="184" height="58" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="360" y="128" text-anchor="middle" font-size="11.5" fill="#8a5a00" font-weight="600">共享的資訊</text>
        <text x="360" y="148" text-anchor="middle" font-size="11.5" fill="#8a5a00">為零才等於獨立</text>
    
        <rect x="452" y="104" width="228" height="58" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="566" y="128" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">知道 X 之後</text>
        <text x="566" y="148" text-anchor="middle" font-size="11.5" fill="#495057">Y 仍剩下的不確定</text>
    
        <text x="360" y="184" text-anchor="middle" font-size="11" fill="#666d75">中段完全對稱：X 告訴你關於 Y 的量，等於 Y 告訴你關於 X 的量</text>
    
        <rect x="40" y="204" width="312" height="94" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="196" y="228" text-anchor="middle" fill="#495057" font-weight="600">為什麼不用相關係數</text>
        <line x1="60" y1="240" x2="332" y2="240" stroke="#e9ecef" stroke-width="1"/>
        <text x="196" y="262" text-anchor="middle" font-size="11.5" fill="#495057">相關係數為零，只排除直線關係</text>
        <text x="196" y="282" text-anchor="middle" font-size="11.5" fill="#495057">中段為零，才排除所有形式的依賴</text>
    
        <rect x="368" y="204" width="312" height="94" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="524" y="228" text-anchor="middle" fill="#8a5a00" font-weight="600">它不會告訴你的事</text>
        <line x1="388" y1="240" x2="660" y2="240" stroke="#ecd3a8" stroke-width="1"/>
        <text x="524" y="262" text-anchor="middle" font-size="11.5" fill="#8a5a00">完全對稱，因此不含方向</text>
        <text x="524" y="282" text-anchor="middle" font-size="11.5" fill="#8a5a00">共享量高，推不出誰影響誰</text>
    
        <line x1="80" y1="322" x2="640" y2="322" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="342" font-size="11.5" fill="#666d75">分解帶僅示結構關係，帶長不代表任何比例、數值或量測結果。</text>
        <text x="80" y="360" font-size="11.5" fill="#666d75">量的定義歸 1948（原文稱傳輸速率）；術語歸 Fano，早於他 1961 年那本書已在課上使用。</text>
        <text x="80" y="378" font-size="11.5" fill="#666d75">理論性質乾淨，估計量不乾淨：連續與高維情形下，有限樣本的估計可能明顯偏高。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">圖：trigpoint.pub</text>
      </g>
    </svg>