<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="自動化等級兩軸模型示意：左為十級自主刻度，右為四個功能階段各自停在不同檔位">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">兩軸：自主等級 × 功能階段</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Sheridan &amp; Verplank (1978) · Parasuraman et al. (2000)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12">
        <text x="60" y="72" fill="#868e96" font-size="11.5">自主程度（上高下低）</text>
        <line x1="110" y1="82" x2="110" y2="318" stroke="#495057" stroke-width="1.2"/>
        <line x1="96" y1="86" x2="124" y2="86" stroke="#495057" stroke-width="1.4"/>
        <line x1="96" y1="112" x2="124" y2="112" stroke="#adb5bd" stroke-width="1"/>
        <line x1="96" y1="138" x2="124" y2="138" stroke="#adb5bd" stroke-width="1"/>
        <line x1="96" y1="164" x2="124" y2="164" stroke="#adb5bd" stroke-width="1"/>
        <line x1="96" y1="190" x2="124" y2="190" stroke="#adb5bd" stroke-width="1"/>
        <line x1="96" y1="216" x2="124" y2="216" stroke="#adb5bd" stroke-width="1"/>
        <line x1="96" y1="242" x2="124" y2="242" stroke="#adb5bd" stroke-width="1"/>
        <line x1="96" y1="268" x2="124" y2="268" stroke="#adb5bd" stroke-width="1"/>
        <line x1="96" y1="290" x2="124" y2="290" stroke="#adb5bd" stroke-width="1"/>
        <line x1="96" y1="314" x2="124" y2="314" stroke="#495057" stroke-width="1.4"/>
        <text x="134" y="90" fill="#212529">L10：電腦全做、不告知人</text>
        <text x="134" y="318" fill="#212529">L1：人做全部</text>
        <text x="134" y="204" fill="#868e96" font-size="11.5">中間各級從略（不逐級引錄）</text>
        <g>
          <line x1="360" y1="90" x2="360" y2="300" stroke="#dee2e6" stroke-width="1"/>
          <line x1="455" y1="90" x2="455" y2="300" stroke="#dee2e6" stroke-width="1"/>
          <line x1="550" y1="90" x2="550" y2="300" stroke="#dee2e6" stroke-width="1"/>
          <line x1="645" y1="90" x2="645" y2="300" stroke="#dee2e6" stroke-width="1"/>
          <circle cx="360" cy="112" r="6" fill="#46608c"/>
          <circle cx="455" cy="136" r="6" fill="#46608c"/>
          <circle cx="550" cy="274" r="6" fill="#f59e0b"/>
          <circle cx="645" cy="238" r="6" fill="#f59e0b"/>
          <path d="M 360 112 L 455 136 L 550 274 L 645 238" fill="none" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 4"/>
          <text x="360" y="322" text-anchor="middle" fill="#495057">取得</text>
          <text x="455" y="322" text-anchor="middle" fill="#495057">分析</text>
          <text x="550" y="322" text-anchor="middle" fill="#495057">決策</text>
          <text x="645" y="322" text-anchor="middle" fill="#495057">執行</text>
        </g>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">同一系統，四個階段可以停在不同檔位（右側為示意配置，非量測）。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">圖：trigpoint.pub</text>
      </g>
    </svg>