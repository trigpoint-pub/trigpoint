<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Endsley 三層情境覺知模型示意：知覺、理解、投射逐層遞進，注意力與工作記憶為跨層瓶頸">
      <defs>
        <marker id="arr-sa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#46608c"/></marker>
      </defs>
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">三層情境覺知模型</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Endsley (1995)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <rect x="60" y="248" width="180" height="58" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="150" y="272" text-anchor="middle" fill="#212529" font-weight="600">Level 1 知覺</text>
        <text x="150" y="292" text-anchor="middle" fill="#868e96" font-size="11.5">見到什麼</text>
        <rect x="270" y="172" width="180" height="58" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="360" y="196" text-anchor="middle" fill="#212529" font-weight="600">Level 2 理解</text>
        <text x="360" y="216" text-anchor="middle" fill="#868e96" font-size="11.5">所以怎樣（對照目標）</text>
        <rect x="480" y="96" width="180" height="58" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="570" y="120" text-anchor="middle" fill="#212529" font-weight="600">Level 3 投射</text>
        <text x="570" y="140" text-anchor="middle" fill="#868e96" font-size="11.5">接下來會怎樣</text>
        <line x1="240" y1="258" x2="296" y2="222" stroke="#46608c" stroke-width="1.8" marker-end="url(#arr-sa)"/>
        <line x1="450" y1="182" x2="506" y2="146" stroke="#46608c" stroke-width="1.8" marker-end="url(#arr-sa)"/>
        <line x1="620" y1="96" x2="648" y2="80" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arr-sa)"/>
        <text x="660" y="72" text-anchor="end" fill="#495057" font-size="11.5">決策 ▸ 行動</text>
        <text x="230" y="310" fill="#8a5a00" font-size="11.5">缺知覺，理解跟着錯</text>
        <text x="452" y="240" fill="#8a5a00" font-size="11.5">理解不成立，投射無從談起</text>
        <rect x="60" y="330" width="600" height="32" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="360" y="351" text-anchor="middle" fill="#495057" font-size="11.5">注意力＋工作記憶＝跨層硬瓶頸；原始資訊過載，先壓垮的是第二層。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">圖：trigpoint.pub</text>
      </g>
    </svg>