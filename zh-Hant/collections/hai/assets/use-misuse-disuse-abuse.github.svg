<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="依賴校準象限示意：信任對照真實可靠度，信過頭為誤用，信不足為棄用；濫用為設計端維度">
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">依賴校準象限</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Parasuraman &amp; Riley (1997)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <text x="150" y="80" fill="#495057" font-size="11.5">人的信任</text>
        <text x="178" y="98" text-anchor="end" fill="#868e96" font-size="11.5">高</text>
        <text x="178" y="300" text-anchor="end" fill="#868e96" font-size="11.5">低</text>
        <rect x="200" y="66" width="220" height="120" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="310" y="118" text-anchor="middle" fill="#8a5a00" font-weight="600">誤用 misuse</text>
        <text x="310" y="140" text-anchor="middle" fill="#8a5a00" font-size="11.5">信過頭：失能時照樣依賴</text>
        <rect x="420" y="66" width="220" height="120" fill="#f2f8f4" stroke="#b7d5c4"/>
        <text x="530" y="118" text-anchor="middle" fill="#1d5c3d" font-weight="600">恰當使用</text>
        <text x="530" y="140" text-anchor="middle" fill="#1d5c3d" font-size="11.5">信任貼住可靠度</text>
        <rect x="200" y="186" width="220" height="120" fill="#f2f8f4" stroke="#b7d5c4"/>
        <text x="310" y="238" text-anchor="middle" fill="#1d5c3d" font-weight="600">恰當拒用</text>
        <text x="310" y="260" text-anchor="middle" fill="#1d5c3d" font-size="11.5">不可靠的，本來就不該靠</text>
        <rect x="420" y="186" width="220" height="120" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="530" y="238" text-anchor="middle" fill="#8a5a00" font-weight="600">棄用 disuse</text>
        <text x="530" y="260" text-anchor="middle" fill="#8a5a00" font-size="11.5">信不足：常由誤報餵大</text>
        <text x="220" y="326" fill="#868e96" font-size="11.5">低</text>
        <text x="620" y="326" text-anchor="end" fill="#868e96" font-size="11.5">高</text>
        <text x="420" y="326" text-anchor="middle" fill="#495057" font-size="11.5">系統真實可靠度</text>
        <rect x="200" y="346" width="440" height="40" rx="4" fill="#fbfaf8" stroke="#ecd3a8" stroke-dasharray="5 4"/>
        <text x="420" y="371" text-anchor="middle" fill="#8a5a00" font-size="11.5">濫用 abuse＝設計端維度：不在此平面上，卻製造平面上的錯位</text>
        <text x="24" y="410" font-size="11.5" fill="#868e96">框架邏輯示意重繪：誤用與棄用成因獨立，非一個旋鈕的兩端。</text>
        <text x="696" y="430" text-anchor="end" font-size="10.5" fill="#c9ccd2">圖：trigpoint.pub</text>
      </g>
    </svg>