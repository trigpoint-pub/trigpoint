<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="依赖校准象限示意：信任对照真实可靠度，信过头为误用，信不足为弃用；滥用为设计端维度">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">依赖校准象限</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Parasuraman &amp; Riley (1997)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <text x="150" y="80" fill="#495057" font-size="11.5">人的信任</text>
        <text x="178" y="98" text-anchor="end" fill="#868e96" font-size="11.5">高</text>
        <text x="178" y="300" text-anchor="end" fill="#868e96" font-size="11.5">低</text>
        <rect x="200" y="66" width="220" height="120" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="310" y="118" text-anchor="middle" fill="#8a5a00" font-weight="600">误用 misuse</text>
        <text x="310" y="140" text-anchor="middle" fill="#8a5a00" font-size="11.5">信过头：失能时照样依赖</text>
        <rect x="420" y="66" width="220" height="120" fill="#f2f8f4" stroke="#b7d5c4"/>
        <text x="530" y="118" text-anchor="middle" fill="#1d5c3d" font-weight="600">恰当使用</text>
        <text x="530" y="140" text-anchor="middle" fill="#1d5c3d" font-size="11.5">信任贴住可靠度</text>
        <rect x="200" y="186" width="220" height="120" fill="#f2f8f4" stroke="#b7d5c4"/>
        <text x="310" y="238" text-anchor="middle" fill="#1d5c3d" font-weight="600">恰当拒用</text>
        <text x="310" y="260" text-anchor="middle" fill="#1d5c3d" font-size="11.5">不可靠的，本来就不该靠</text>
        <rect x="420" y="186" width="220" height="120" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="530" y="238" text-anchor="middle" fill="#8a5a00" font-weight="600">弃用 disuse</text>
        <text x="530" y="260" text-anchor="middle" fill="#8a5a00" font-size="11.5">信不足：常由误报喂大</text>
        <text x="220" y="326" fill="#868e96" font-size="11.5">低</text>
        <text x="620" y="326" text-anchor="end" fill="#868e96" font-size="11.5">高</text>
        <text x="420" y="326" text-anchor="middle" fill="#495057" font-size="11.5">系统真实可靠度</text>
        <rect x="200" y="346" width="440" height="40" rx="4" fill="#fbfaf8" stroke="#ecd3a8" stroke-dasharray="5 4"/>
        <text x="420" y="371" text-anchor="middle" fill="#8a5a00" font-size="11.5">滥用 abuse＝设计端维度：不在此平面上，却制造平面上的错位</text>
        <text x="24" y="410" font-size="11.5" fill="#868e96">框架逻辑示意重绘：误用与弃用成因独立，非一个旋钮的两端。</text>
        <text x="696" y="430" text-anchor="end" font-size="10.5" fill="#c9ccd2">图：trigpoint.pub</text>
      </g>
    </svg>