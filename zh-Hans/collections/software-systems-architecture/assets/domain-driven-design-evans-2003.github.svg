<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="上排为知识入系统之路径：共用词汇直接成为模型与程式的名字，中间无翻译层；下排为规模上来后切界，界内语义一致，跨界靠对照图与防腐转换">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">边界的第一个载体是词汇，不是图</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Evans (2003)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="70" width="126" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="103" y="92" text-anchor="middle" fill="#495057">领域知识</text>
        <text x="103" y="110" text-anchor="middle" font-size="11" fill="#666d75">含条件与例外</text>
    
        <path d="M172 96 L200 96" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M200 96 l-7 -4 v8 z" fill="#495057"/>
    
        <rect x="206" y="70" width="150" height="52" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="281" y="92" text-anchor="middle" fill="#212529" font-weight="600">共用一组词汇</text>
        <text x="281" y="110" text-anchor="middle" font-size="11" fill="#495057">中间不设翻译层</text>
    
        <path d="M362 96 L390 96" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M390 96 l-7 -4 v8 z" fill="#495057"/>
    
        <rect x="396" y="70" width="150" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="471" y="92" text-anchor="middle" fill="#495057">模型与程式的名字</text>
        <text x="471" y="110" text-anchor="middle" font-size="11" fill="#666d75">词汇表没有的，不该偷偷长出来</text>
    
        <rect x="552" y="70" width="128" height="52" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="616" y="90" text-anchor="middle" font-size="11" fill="#8a5a00">常见误用：只套命名</text>
        <text x="616" y="108" text-anchor="middle" font-size="11" fill="#8a5a00">略过语言与切界</text>
    
        <text x="40" y="156" font-size="11.5" font-weight="600" fill="#495057">规模上来之后：切界，不是统一</text>
    
        <rect x="40" y="166" width="196" height="76" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="190" text-anchor="middle" fill="#495057" font-weight="600">界 A</text>
        <text x="138" y="210" text-anchor="middle" font-size="11.5" fill="#495057">界内语义一致</text>
        <text x="138" y="228" text-anchor="middle" font-size="11" fill="#666d75">同一个词在此只有一义</text>
    
        <rect x="262" y="176" width="196" height="56" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="360" y="198" text-anchor="middle" fill="#212529" font-weight="600">对照图 ＋ 防腐转换</text>
        <text x="360" y="218" text-anchor="middle" font-size="11" fill="#495057">跨界一律显式转换</text>
    
        <rect x="484" y="166" width="196" height="76" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="582" y="190" text-anchor="middle" fill="#495057" font-weight="600">界 B</text>
        <text x="582" y="210" text-anchor="middle" font-size="11.5" fill="#495057">同一个词可以是另一义</text>
        <text x="582" y="228" text-anchor="middle" font-size="11" fill="#666d75">这是允许的，不是缺陷</text>
    
        <path d="M242 204 L256 204" stroke="#adb5bd" stroke-width="1.5" fill="none"/>
        <path d="M464 204 L478 204" stroke="#adb5bd" stroke-width="1.5" fill="none"/>
    
        <rect x="40" y="256" width="640" height="44" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="278" text-anchor="middle" fill="#495057" font-weight="600">发现同一个词在两条线指不同东西时，不要统一，画界</text>
        <text x="360" y="294" text-anchor="middle" font-size="11.5" fill="#495057">设计力气优先投在真正差异化的那一块，其余用现成做法</text>
    
        <line x1="80" y1="322" x2="640" y2="322" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="340" font-size="11.5" fill="#666d75">流程为概念示意，不含任何量测数字。</text>
        <text x="80" y="358" font-size="11.5" fill="#666d75">一个界不等于一个服务：两者正交，硬绑部署边界会误切，见本站微服务页。</text>
        <text x="80" y="376" font-size="11.5" fill="#666d75">据报导，作者后来说：战术建构元件被过度强调，策略层应更受重视。</text>
        <text x="696" y="394" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>