<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三层成因示意：资料层以来源与参考不一致为主、训练与推论层有表征学习与曝光偏差等、解码端多样性取样与幻觉正相关；中段标出模型往往不说不知道而会继续流畅取样。刻意不含任何比率">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">危险不在错，在错得流畅</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Ji et al. (2023)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="70" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="90" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">资料层</text>
        <text x="138" y="110" text-anchor="middle" font-size="11" fill="#666d75">来源与参考不一致为主，另有重复</text>
    
        <rect x="40" y="132" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="152" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">训练层</text>
        <text x="138" y="172" text-anchor="middle" font-size="11" fill="#666d75">表征学习、曝光偏差、知识偏差</text>
    
        <rect x="40" y="194" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="138" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#495057">解码层</text>
        <text x="138" y="234" text-anchor="middle" font-size="11" fill="#666d75">多样性取样与幻觉正相关（推测）</text>
    
        <path d="M242 158 L276 158" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M276 158 l-7 -4 v8 z" fill="#495057"/>
    
        <rect x="282" y="120" width="176" height="76" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="370" y="144" text-anchor="middle" fill="#8a5a00" font-weight="600">超出可靠范围时</text>
        <text x="370" y="164" text-anchor="middle" font-size="11.5" fill="#8a5a00">模型往往不说「我不知道」</text>
        <text x="370" y="182" text-anchor="middle" font-size="11.5" fill="#8a5a00">它会继续流畅取样</text>
    
        <path d="M464 158 L498 158" stroke="#8a5a00" stroke-width="1.5" fill="none"/>
        <path d="M498 158 l-7 -4 v8 z" fill="#8a5a00"/>
    
        <rect x="504" y="120" width="176" height="36" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="592" y="143" text-anchor="middle" font-size="11.5" fill="#212529">内在型：与来源矛盾</text>
        <rect x="504" y="160" width="176" height="36" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="592" y="183" text-anchor="middle" font-size="11.5" fill="#212529">外在型：来源无法验证</text>
    
        <rect x="282" y="206" width="398" height="40" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="481" y="230" text-anchor="middle" font-size="11.5" fill="#495057">两型查法不同：矛盾用比对抓，未提用存在性查核抓</text>
    
        <rect x="40" y="266" width="640" height="46" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="286" text-anchor="middle" fill="#495057" font-weight="600">三层各有缓解手段，没有单点解</text>
        <text x="360" y="304" text-anchor="middle" font-size="11.5" fill="#495057">改变证据供给、改变训练目标、约束解码；只能收窄，不可假设已归零</text>
    
        <line x1="80" y1="334" x2="640" y2="334" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="352" font-size="11.5" fill="#666d75">机制为概念示意，刻意不标任何幻觉率或比例：该类数字换资料集、任务或模型版本即换一组。</text>
        <text x="80" y="370" font-size="11.5" fill="#666d75">两型皆相对于「来源内容」定义：换一个来源界定，类型会变。</text>
        <text x="80" y="388" font-size="11.5" fill="#666d75">内在／外在这组分类承袭前作，非该综述所提出。</text>
        <text x="696" y="398" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>