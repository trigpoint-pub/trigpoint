<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两轴四象限示意：横轴为字面是否相同，纵轴为意图是否相同。原则只治意图相同的一侧；字面相同而意图不同的那一格是最常见误用">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">要治的是意图重复，不是字面重复</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Hunt &amp; Thomas (1999, 2019)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="76" font-size="11.5" fill="#666d75">纵轴：背后的意图</text>
        <text x="404" y="76" font-size="11.5" fill="#666d75">横轴：字面</text>
    
        <rect x="152" y="88" width="252" height="98" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="278" y="118" text-anchor="middle" fill="#495057" font-weight="600">同一块知识，写法不同</text>
        <text x="278" y="140" text-anchor="middle" font-size="11.5" fill="#495057">同一条判准散在规格、指示、说明里</text>
        <text x="278" y="160" text-anchor="middle" font-size="11.5" fill="#495057">字面看不出重复，改的时候会漏</text>
        <text x="278" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#8a5a00">这格才是原则要治的</text>
    
        <rect x="410" y="88" width="252" height="98" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="536" y="118" text-anchor="middle" fill="#495057" font-weight="600">同一块知识，写法也相同</text>
        <text x="536" y="140" text-anchor="middle" font-size="11.5" fill="#495057">最容易看见的一种重复</text>
        <text x="536" y="160" text-anchor="middle" font-size="11.5" fill="#495057">收成一处、他处引用即可</text>
        <text x="536" y="178" text-anchor="middle" font-size="11" fill="#666d75">处理起来最不费力</text>
    
        <rect x="152" y="196" width="252" height="98" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="278" y="226" text-anchor="middle" fill="#495057" font-weight="600">不同的知识，写法也不同</text>
        <text x="278" y="248" text-anchor="middle" font-size="11.5" fill="#666d75">两件事各自独立</text>
        <text x="278" y="268" text-anchor="middle" font-size="11.5" fill="#666d75">没有问题，不需动作</text>
    
        <rect x="410" y="196" width="252" height="98" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="536" y="226" text-anchor="middle" fill="#8a5a00" font-weight="600">不同的知识，写法恰好相同</text>
        <text x="536" y="248" text-anchor="middle" font-size="11.5" fill="#8a5a00">今天一样是巧合，明天其中一条要改</text>
        <text x="536" y="268" text-anchor="middle" font-size="11.5" fill="#8a5a00">合并它们＝把巧合当成结构</text>
        <text x="536" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#8a5a00">最常见的误用落在这格</text>
    
        <text x="40" y="130" font-size="11.5" fill="#495057">相同</text>
        <text x="40" y="238" font-size="11.5" fill="#495057">不同</text>
        <text x="220" y="312" text-anchor="middle" font-size="11.5" fill="#495057">不同</text>
        <text x="536" y="312" text-anchor="middle" font-size="11.5" fill="#495057">相同</text>
    
        <line x1="80" y1="336" x2="640" y2="336" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="356" font-size="11.5" fill="#666d75">象限为概念示意，不含比例、面积或任何量测数字。</text>
        <text x="80" y="374" font-size="11.5" fill="#666d75">判断落哪一格只需一问：这两处之所以存在，是为了同一个意图吗。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>