<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="由内往外三层示意：核心宣告介面、技术写转接实作、依赖方向由外指向内；左为主动侧人与测试，右为被动侧资料库与外部系统">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">介面由核心定义，技术来实作它</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Cockburn (2005)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="196" y="130" width="328" height="120" rx="6" fill="#ffffff" stroke="#dee2e6"/>
        <text x="360" y="152" text-anchor="middle" font-size="11" fill="#666d75">转接层</text>
    
        <rect x="238" y="162" width="244" height="72" rx="5" fill="#f8f9fa" stroke="#868e96"/>
        <text x="360" y="182" text-anchor="middle" font-size="11" fill="#495057">介面层（由核心宣告）</text>
    
        <rect x="276" y="190" width="168" height="36" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="360" y="213" text-anchor="middle" fill="#212529" font-weight="600">核心</text>
    
        <text x="40" y="120" font-size="11.5" font-weight="600" fill="#495057">主动侧</text>
        <rect x="40" y="130" width="140" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="110" y="152" text-anchor="middle" font-size="11.5" fill="#495057">人来操作</text>
        <rect x="40" y="170" width="140" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="110" y="192" text-anchor="middle" font-size="11.5" fill="#495057">自动化测试</text>
        <rect x="40" y="210" width="140" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="110" y="232" text-anchor="middle" font-size="11.5" fill="#495057">批次或另一个程式</text>
    
        <text x="540" y="120" font-size="11.5" font-weight="600" fill="#495057">被动侧</text>
        <rect x="540" y="130" width="140" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="610" y="152" text-anchor="middle" font-size="11.5" fill="#495057">资料库</text>
        <rect x="540" y="170" width="140" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="610" y="192" text-anchor="middle" font-size="11.5" fill="#495057">外部系统</text>
        <rect x="540" y="210" width="140" height="34" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="610" y="232" text-anchor="middle" font-size="11.5" fill="#495057">记忆体内的假转接</text>
    
        <path d="M186 187 L232 197" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M232 197 l-8 -2 l1 8 z" fill="#495057"/>
        <path d="M534 197 L488 197" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M488 197 l7 -4 v8 z" fill="#495057"/>
        <text x="196" y="264" font-size="11" fill="#666d75">依赖方向一律由外指向内</text>
    
        <rect x="40" y="278" width="316" height="46" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="198" y="298" text-anchor="middle" fill="#495057" font-weight="600">可验证的判准</text>
        <text x="198" y="316" text-anchor="middle" font-size="11.5" fill="#495057">核心能不能在没有任何外部技术下跑起来</text>
    
        <rect x="364" y="278" width="316" height="46" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="522" y="298" text-anchor="middle" fill="#8a5a00" font-weight="600">假解耦长什么样</text>
        <text x="522" y="316" text-anchor="middle" font-size="11.5" fill="#8a5a00">有介面，但介面的名字是照着工具的语汇写的</text>
    
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#666d75">层系为概念示意，不含任何量测数字；本图刻意不画成六边，因原文自陈六边与数字无关。</text>
        <text x="80" y="380" font-size="11.5" fill="#666d75">主张依 2005 年原文报告核对；本页逐字引用者只有意图那段。</text>
        <text x="696" y="394" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>