<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="格式轴与实体轴脱钩示意：格式规律使取样熟练、外观完整；实体是否存在为独立事实。唯一拦截点为回去查存在性。刻意不含任何比率">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">外壳完整，内核是空的</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Walters &amp; Wilder (2023)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="72" font-size="11.5" font-weight="600" fill="#495057">格式轴　模型很擅长这一轴</text>
        <rect x="40" y="82" width="640" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="56" y="104" font-size="11.5" fill="#495057">作者　年份　期刊　卷期　页码　识别码　　或　　案号　法院　年份</text>
        <text x="56" y="124" font-size="11" fill="#666d75">高度规律的表面结构，可在未查询任何资料库的情况下取样出来，语法完美、格式合规</text>
    
        <text x="40" y="164" font-size="11.5" font-weight="600" fill="#8a5a00">实体轴　与上一轴互不蕴涵</text>
        <rect x="40" y="174" width="196" height="52" rx="4" fill="#ffffff" stroke="#495057"/>
        <text x="138" y="196" text-anchor="middle" font-size="11.5" fill="#212529">真实引用</text>
        <text x="138" y="214" text-anchor="middle" font-size="11" fill="#495057">标题与作者皆对得上</text>
    
        <rect x="242" y="174" width="196" height="52" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="340" y="196" text-anchor="middle" font-size="11.5" fill="#495057">真实但记错</text>
        <text x="340" y="214" text-anchor="middle" font-size="11" fill="#666d75">另一条曲线，不可与虚构混报</text>
    
        <rect x="444" y="174" width="236" height="52" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="562" y="196" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a5a00">虚构引用</text>
        <text x="562" y="214" text-anchor="middle" font-size="11" fill="#8a5a00">格式合规，实体不存在或张冠李戴</text>
    
        <text x="360" y="250" text-anchor="middle" font-size="11.5" fill="#8a5a00">三者在外观上完全无法区分</text>
    
        <rect x="40" y="264" width="640" height="50" rx="4" fill="#f8f9fa" stroke="#495057"/>
        <text x="360" y="286" text-anchor="middle" fill="#212529" font-weight="600">唯一的拦截点：拿标题与作者回实际资料库查存在性</text>
        <text x="360" y="304" text-anchor="middle" font-size="11.5" fill="#495057">这一步不能委派给生成它的那个模型：生成是取样不是查询，它不知道自己在编</text>
    
        <line x1="80" y1="334" x2="640" y2="334" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="352" font-size="11.5" fill="#666d75">机制为概念示意，刻意不标任何虚构率：该类数字须绑定研究、模型版本与时点，图上绑不住。</text>
        <text x="80" y="370" font-size="11.5" fill="#666d75">本站不列出该司法案件中的虚构案名；判决书正文逐一列有。</text>
        <text x="80" y="388" font-size="11.5" fill="#666d75">把虚构引用归为外在型幻觉是一次明示的外推：原分类定义于有明确来源的任务。</text>
        <text x="696" y="398" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>