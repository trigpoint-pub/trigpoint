        <line x1="380" y1="88" x2="380" y2="292" stroke="#eceff1" stroke-width="1"/>
        <line x1="174" y1="190" x2="586" y2="190" stroke="#eceff1" stroke-width="1"/>
        <text x="380" y="318" text-anchor="middle" fill="#8a5a00" font-size="11.5">每型服务一种读者需求，各有独立写作准则：混写是文件品质劣化的结构性成因。</text>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">四型名称为 primary 站逐字；本图布局为示意，非原站图版（示意重绘）。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">图：trigpoint.pub</text>
