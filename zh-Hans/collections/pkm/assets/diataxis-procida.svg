        <rect x="170" y="84" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="270" y="122" text-anchor="middle" fill="#212529" font-weight="600">tutorial 教程</text>
        <text x="270" y="144" text-anchor="middle" fill="#495057" font-size="11.5">学习中的实作引导</text>
        <rect x="390" y="84" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="490" y="122" text-anchor="middle" fill="#212529" font-weight="600">how-to 指南</text>
        <text x="490" y="144" text-anchor="middle" fill="#495057" font-size="11.5">工作中的目标达成步骤</text>
        <rect x="170" y="196" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="270" y="234" text-anchor="middle" fill="#212529" font-weight="600">explanation 解说</text>
        <text x="270" y="256" text-anchor="middle" fill="#495057" font-size="11.5">学习中求理解</text>
        <rect x="390" y="196" width="200" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="490" y="234" text-anchor="middle" fill="#212529" font-weight="600">reference 参考</text>
        <text x="490" y="256" text-anchor="middle" fill="#495057" font-size="11.5">工作中查资讯</text>
        <text x="140" y="130" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 140 130)">实作（做）</text>
