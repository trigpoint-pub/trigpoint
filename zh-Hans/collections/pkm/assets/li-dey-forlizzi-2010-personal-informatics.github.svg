<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="个人资讯学五阶段：准备、收集、整合、反思、行动；反思与行动可回馈准备，各阶段障碍向后级联">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <defs>
        <marker id="arr-li" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#46608c"/></marker>
        <marker id="arr-li-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
      </defs>
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">五阶段：收集只是第二级</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Li, Dey &amp; Forlizzi (2010)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <rect x="60" y="200" width="108" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="114" y="222" text-anchor="middle" fill="#212529" font-weight="600">准备</text>
        <text x="114" y="240" text-anchor="middle" fill="#495057" font-size="11">收集什么、用什么</text>
        <rect x="190" y="172" width="108" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="244" y="194" text-anchor="middle" fill="#212529" font-weight="600">收集</text>
        <text x="244" y="212" text-anchor="middle" fill="#495057" font-size="11">实际记录</text>
        <rect x="320" y="144" width="108" height="52" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="374" y="166" text-anchor="middle" fill="#212529" font-weight="600">整合</text>
        <text x="374" y="184" text-anchor="middle" fill="#495057" font-size="11">拼成可看的全貌</text>
        <rect x="450" y="116" width="108" height="52" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="504" y="138" text-anchor="middle" fill="#212529" font-weight="600">反思</text>
        <text x="504" y="156" text-anchor="middle" fill="#495057" font-size="11">找模式、提洞察</text>
        <rect x="580" y="88" width="108" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="634" y="110" text-anchor="middle" fill="#212529" font-weight="600">行动</text>
        <text x="634" y="128" text-anchor="middle" fill="#495057" font-size="11">改变行为</text>
        <line x1="168" y1="220" x2="184" y2="206" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-li)"/>
        <line x1="298" y1="192" x2="314" y2="178" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-li)"/>
        <line x1="428" y1="164" x2="444" y2="150" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-li)"/>
        <line x1="558" y1="136" x2="574" y2="122" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-li)"/>
        <path d="M 504 172 C 420 260, 240 272, 122 258" fill="none" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr-li)"/>
        <text x="330" y="284" text-anchor="middle" fill="#868e96" font-size="11.5">非严格线性：反思与行动回馈到准备</text>
        <path d="M 120 300 C 280 316, 480 316, 640 300" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-li-a)"/>
        <text x="380" y="332" text-anchor="middle" fill="#8a5a00" font-size="11.5">障碍向后级联：上游选错，下游付账（各阶段障碍清单出自同一篇论文）</text>
        <line x1="80" y1="348" x2="640" y2="348" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="366" font-size="11.5" fill="#868e96">阶段名称经多源三角核对；本图为模型示意，非原论文图版（示意重绘）。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">图：trigpoint.pub</text>
      </g>
    </svg>