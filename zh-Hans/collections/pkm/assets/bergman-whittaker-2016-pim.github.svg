<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="碎片化代价的适用边界定性示意：只在被系统设计所迫且跨生态格式的分裂触发；同一基座内的自愿多档分流不触发">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">碎片化代价：只咬一格</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Bergman &amp; Whittaker (2016)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <text x="395" y="72" text-anchor="middle" fill="#868e96" font-size="11.5">同一基座（如同一笔记库）　　←　　→　　跨生态／跨格式（文件、邮件、书签各一处）</text>
        <rect x="200" y="84" width="190" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="295" y="122" text-anchor="middle" fill="#212529">自愿 × 同基座</text>
        <text x="295" y="144" text-anchor="middle" fill="#495057" font-size="11.5">多档分流：不触发</text>
        <rect x="410" y="84" width="190" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="505" y="122" text-anchor="middle" fill="#212529">自愿 × 跨生态</text>
        <text x="505" y="144" text-anchor="middle" fill="#495057" font-size="11.5">自选分工：原命题不咬</text>
        <rect x="200" y="196" width="190" height="100" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="295" y="234" text-anchor="middle" fill="#212529">被迫 × 同基座</text>
        <text x="295" y="256" text-anchor="middle" fill="#495057" font-size="11.5">罕见组合：原命题不咬</text>
        <rect x="410" y="196" width="190" height="100" rx="4" fill="#fdf3e0" stroke="#ecd3a8" stroke-width="1.4"/>
        <text x="505" y="230" text-anchor="middle" fill="#8a5a00" font-weight="600">被迫 × 跨生态</text>
        <text x="505" y="252" text-anchor="middle" fill="#8a5a00" font-size="11.5">碎片化代价在此触发</text>
        <text x="505" y="270" text-anchor="middle" fill="#8a5a00" font-size="11.5">（设计迫使的格式分裂）</text>
        <text x="170" y="130" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 170 130)">自愿分流</text>
        <text x="170" y="252" text-anchor="middle" fill="#868e96" font-size="11.5" transform="rotate(-90 170 252)">设计所迫</text>
        <line x1="400" y1="88" x2="400" y2="292" stroke="#eceff1" stroke-width="1"/>
        <line x1="204" y1="190" x2="596" y2="190" stroke="#eceff1" stroke-width="1"/>
        <text x="395" y="318" text-anchor="middle" fill="#495057" font-size="11.5">另一发现：对个人资料，自己整理的结构在检索上胜过纯搜寻（人有空间、时间与功能记忆）。</text>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">定性示意，无量测值；「被迫」为对原文 format-related／design-encouraged 之转述（示意重绘）。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">图：trigpoint.pub</text>
      </g>
    </svg>