<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两种连结对照：跳转式超连结单向且目标不知被连；transclusion 内容以引用嵌入多处，源头一改处处同步">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <defs>
        <marker id="arr-ht" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#46608c"/></marker>
        <marker id="arr-ht-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
      </defs>
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">两种「连结」：跳转与透入</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#868e96">Nelson (1965)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
        <text x="80" y="76" fill="#868e96" font-size="11.5">跳转式超连结（Web 采用）</text>
        <rect x="80" y="88" width="150" height="40" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="155" y="113" text-anchor="middle" fill="#212529">文件 A</text>
        <rect x="410" y="88" width="150" height="40" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="485" y="113" text-anchor="middle" fill="#212529">文件 B</text>
        <line x1="230" y1="108" x2="404" y2="108" stroke="#46608c" stroke-width="1.5" marker-end="url(#arr-ht)"/>
        <text x="317" y="100" text-anchor="middle" fill="#495057" font-size="11.5">单向跳转</text>
        <text x="580" y="113" fill="#868e96" font-size="11.5">B 不知道被连</text>
        <line x1="80" y1="160" x2="640" y2="160" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="186" fill="#868e96" font-size="11.5">Transclusion 跨包含（Xanadu 愿景；今日之区块嵌入）</text>
        <rect x="290" y="200" width="150" height="44" rx="4" fill="#fbfaf8" stroke="#dee2e6"/>
        <text x="365" y="220" text-anchor="middle" fill="#212529" font-weight="600">源内容 S</text>
        <text x="365" y="237" text-anchor="middle" fill="#495057" font-size="11.5">单一 canonical</text>
        <rect x="80" y="280" width="180" height="44" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="170" y="300" text-anchor="middle" fill="#212529">文件 A</text>
        <text x="170" y="317" text-anchor="middle" fill="#8a5a00" font-size="11.5">〔S 透入于此〕</text>
        <rect x="460" y="280" width="180" height="44" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="550" y="300" text-anchor="middle" fill="#212529">文件 B</text>
        <text x="550" y="317" text-anchor="middle" fill="#8a5a00" font-size="11.5">〔S 透入于此〕</text>
        <path d="M 320 244 C 280 260, 230 270, 190 276" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-ht-a)"/>
        <path d="M 410 244 C 450 260, 500 270, 540 276" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-ht-a)"/>
        <text x="365" y="296" text-anchor="middle" fill="#8a5a00" font-size="11.5">以引用嵌入（非复制）：</text>
        <text x="365" y="312" text-anchor="middle" fill="#8a5a00" font-size="11.5">源一改，处处同步</text>
        <line x1="80" y1="344" x2="640" y2="344" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="362" font-size="11.5" fill="#868e96">Web 采跳转、舍透入与双向：工程取舍，非愿景证伪（示意重绘）。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#c9ccd2">图：trigpoint.pub</text>
      </g>
    </svg>