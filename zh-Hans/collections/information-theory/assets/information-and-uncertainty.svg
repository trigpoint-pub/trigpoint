<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="资讯出现的机制流程：可能性空间、事件发生、排除其余、被排除的份量即资讯；下方为资讯量与意义两轴正交的四格对照">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">资讯 = 被排除掉的那一份</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Shannon (1948) · Hartley (1928)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="40" y="76" fill="#495057" font-weight="600" font-size="13">机制</text>
    
        <rect x="40" y="88" width="126" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="103" y="110" text-anchor="middle" fill="#212529">可能性空间</text>
        <text x="103" y="128" text-anchor="middle" font-size="11" fill="#666d75">尚未揭晓</text>
    
        <path d="M172 114 L198 114" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M198 114 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="204" y="88" width="126" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="267" y="110" text-anchor="middle" fill="#212529">事件发生</text>
        <text x="267" y="128" text-anchor="middle" font-size="11" fill="#666d75">其中一个成真</text>
    
        <path d="M336 114 L362 114" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M362 114 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="368" y="88" width="126" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="431" y="110" text-anchor="middle" fill="#212529">其余被排除</text>
        <text x="431" y="128" text-anchor="middle" font-size="11" fill="#666d75">可能性收窄</text>
    
        <path d="M500 114 L526 114" stroke="#8a5a00" stroke-width="1.5" fill="none"/>
        <path d="M526 114 l-7 -4 v8 z" fill="#8a5a00"/>
    
        <rect x="532" y="88" width="148" height="52" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="606" y="110" text-anchor="middle" fill="#8a5a00" font-weight="600">资讯出现</text>
        <text x="606" y="128" text-anchor="middle" font-size="11" fill="#8a5a00">量 = 被排除的份量</text>
    
        <text x="40" y="176" fill="#495057" font-weight="600" font-size="13">两轴互不决定</text>
    
        <line x1="196" y1="196" x2="196" y2="332" stroke="#ced4da" stroke-width="1"/>
        <line x1="196" y1="332" x2="628" y2="332" stroke="#ced4da" stroke-width="1"/>
        <text x="182" y="200" text-anchor="end" font-size="11" fill="#666d75">资讯量高</text>
        <text x="182" y="330" text-anchor="end" font-size="11" fill="#666d75">资讯量低</text>
        <text x="212" y="352" font-size="11" fill="#666d75">意义低</text>
        <text x="628" y="352" text-anchor="end" font-size="11" fill="#666d75">意义高</text>
    
        <rect x="208" y="196" width="196" height="60" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="306" y="222" text-anchor="middle" font-size="11.5" fill="#495057">出乎意料而全错的断言</text>
        <text x="306" y="240" text-anchor="middle" font-size="11" fill="#666d75">排除很多，却不值得信</text>
    
        <rect x="420" y="196" width="196" height="60" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="518" y="222" text-anchor="middle" font-size="11.5" fill="#495057">出乎意料而正确的判断</text>
        <text x="518" y="240" text-anchor="middle" font-size="11" fill="#666d75">两轴同时高，最稀有</text>
    
        <rect x="208" y="264" width="196" height="60" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="306" y="290" text-anchor="middle" font-size="11.5" fill="#495057">冗长而可预测的覆述</text>
        <text x="306" y="308" text-anchor="middle" font-size="11" fill="#666d75">字数不等于资讯</text>
    
        <rect x="420" y="264" width="196" height="60" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="518" y="290" text-anchor="middle" font-size="11.5" fill="#495057">众所周知的重要事实</text>
        <text x="518" y="308" text-anchor="middle" font-size="11" fill="#666d75">有意义，但没排除什么</text>
    
        <text x="40" y="378" font-size="11.5" fill="#666d75">四格为概念定位示意，非量测结果：本图不含座标值、比例或任何数量宣称。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>