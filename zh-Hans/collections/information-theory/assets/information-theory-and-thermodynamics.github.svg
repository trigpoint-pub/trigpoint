<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="计算能耗阶序示意：最底为擦除资讯的理论下界，其上为可逆计算的原理位置，最上为实际硬体，三者之间只标阶序与差距存在而不标倍数">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">耗能的不是思考，是遗忘</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Szilárd (1929) · Landauer (1961) · Bennett (1973)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="62" width="392" height="192" rx="4" fill="#ffffff" stroke="#dee2e6"/>
    
        <rect x="72" y="80" width="328" height="42" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="236" y="98" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">实际计算硬体</text>
        <text x="236" y="114" text-anchor="middle" font-size="11" fill="#666d75">远在下界之上，差距很大</text>
    
        <text x="236" y="140" text-anchor="middle" font-size="11" fill="#8a5a00">本图不标倍数：该数值本站未一手核实</text>
    
        <rect x="72" y="152" width="328" height="42" rx="3" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="236" y="170" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">原理上可逆的计算</text>
        <text x="236" y="186" text-anchor="middle" font-size="11" fill="#666d75">若不擦除，原理上可远低于下界</text>
    
        <rect x="72" y="204" width="328" height="34" rx="3" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="236" y="226" text-anchor="middle" font-size="11.5" fill="#8a5a00" font-weight="600">擦除一个位元的理论下界</text>
    
        <line x1="56" y1="238" x2="56" y2="86" stroke="#ced4da" stroke-width="1"/>
        <path d="M56 86 l-4 7 h8 z" fill="#ced4da"/>
        <text x="48" y="164" text-anchor="middle" font-size="11" fill="#666d75" transform="rotate(-90 48 164)">能耗</text>
    
        <rect x="448" y="62" width="232" height="90" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="564" y="86" text-anchor="middle" fill="#495057" font-weight="600">关键区分，抹掉即结论反转</text>
        <line x1="468" y1="98" x2="660" y2="98" stroke="#dee2e6" stroke-width="1"/>
        <text x="564" y="120" text-anchor="middle" font-size="11.5" fill="#495057">下界只对逻辑不可逆的操作成立</text>
        <text x="564" y="140" text-anchor="middle" font-size="11.5" fill="#495057">不直接适用于测量与传输</text>
    
        <rect x="448" y="164" width="232" height="90" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="564" y="188" text-anchor="middle" fill="#8a5a00" font-weight="600">并陈不裁</text>
        <line x1="468" y1="200" x2="660" y2="200" stroke="#ecd3a8" stroke-width="1"/>
        <text x="564" y="222" text-anchor="middle" font-size="11.5" fill="#8a5a00">有一组批评质疑此原理的一般证明</text>
        <text x="564" y="242" text-anchor="middle" font-size="11.5" fill="#8a5a00">及它能否用来驱逐守门者</text>
    
        <rect x="40" y="272" width="640" height="48" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="294" text-anchor="middle" fill="#495057" font-weight="600">本书架做的正是这套理论的创立者警告过的事</text>
        <text x="360" y="312" text-anchor="middle" font-size="11.5" fill="#495057">1956 年他写过社论，警告用到他领域要经实验验证，不是搬词：这一段的地位低于前面几段</text>
    
        <line x1="80" y1="340" x2="640" y2="340" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="360" font-size="11.5" fill="#666d75">阶序只标顺序与差距存在，刻意不标倍数、能量数值或单位。</text>
        <text x="80" y="378" font-size="11.5" fill="#666d75">1929 那篇已对照英译全文；1961 与 1973 两篇只核到书目与摘要。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>