<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="压缩的正路与歧路示意：正路辨识规律去除冗余并止于熵这道地板，歧路直接删内容导致资讯丢失；下方为判断两者的单一问句">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">两条路都会变短，只有一条没有损失</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Shannon (1948) · Fano (1949) · Huffman (1952)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="126" width="112" height="52" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="96" y="148" text-anchor="middle" fill="#212529">原始表示</text>
        <text x="96" y="166" text-anchor="middle" font-size="11" fill="#666d75">含冗余</text>
    
        <path d="M158 140 L188 108" stroke="#495057" stroke-width="1.5" fill="none"/>
        <path d="M188 108 l-2 8 l7 -4 z" fill="#495057"/>
        <path d="M158 164 L188 196" stroke="#8a5a00" stroke-width="1.5" fill="none" stroke-dasharray="5 3"/>
        <path d="M188 196 l-5 -7 l-2 8 z" fill="#8a5a00"/>
    
        <text x="196" y="80" fill="#495057" font-weight="600" font-size="13">正路：去冗余</text>
        <rect x="196" y="88" width="132" height="44" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="262" y="106" text-anchor="middle" font-size="11.5" fill="#212529">辨识可预测的部分</text>
        <text x="262" y="123" text-anchor="middle" font-size="11" fill="#666d75">接收端能自己推回来</text>
    
        <path d="M334 110 L360 110" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M360 110 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="366" y="88" width="132" height="44" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <text x="432" y="106" text-anchor="middle" font-size="11.5" fill="#212529">常见的用短码</text>
        <text x="432" y="123" text-anchor="middle" font-size="11" fill="#666d75">罕见的用长码</text>
    
        <path d="M504 110 L530 110" stroke="#868e96" stroke-width="1.5" fill="none"/>
        <path d="M530 110 l-7 -4 v8 z" fill="#868e96"/>
    
        <rect x="536" y="80" width="144" height="60" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
        <text x="608" y="102" text-anchor="middle" fill="#495057" font-weight="600">止于熵</text>
        <line x1="556" y1="112" x2="660" y2="112" stroke="#8a5a00" stroke-width="2"/>
        <text x="608" y="130" text-anchor="middle" font-size="11" fill="#8a5a00">地板，跨不过去</text>
    
        <text x="196" y="186" fill="#8a5a00" font-weight="600" font-size="13">歧路：删内容</text>
        <rect x="196" y="194" width="132" height="44" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="262" y="212" text-anchor="middle" font-size="11.5" fill="#8a5a00">挑看起来次要的砍</text>
        <text x="262" y="229" text-anchor="middle" font-size="11" fill="#8a5a00">条件词最常被误砍</text>
    
        <path d="M334 216 L360 216" stroke="#ecd3a8" stroke-width="1.5" fill="none" stroke-dasharray="5 3"/>
        <path d="M360 216 l-7 -4 v8 z" fill="#ecd3a8"/>
    
        <rect x="366" y="194" width="314" height="44" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="523" y="212" text-anchor="middle" font-size="11.5" fill="#8a5a00">也会变短，但短的原因是资讯被丢掉</text>
        <text x="523" y="229" text-anchor="middle" font-size="11" fill="#8a5a00">读者拿到一个更清爽也更容易误用的版本</text>
    
        <rect x="40" y="264" width="640" height="52" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="286" text-anchor="middle" fill="#495057" font-weight="600">分辨两条路，只需要一个问句</text>
        <text x="360" y="306" text-anchor="middle" font-size="11.5" fill="#495057">我删掉的这句话，读者能不能从剩下的内容推回来：能是冗余，不能是资讯</text>
    
        <line x1="80" y1="338" x2="640" y2="338" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="358" font-size="11.5" fill="#666d75">流程为概念示意，不含压缩率、比例或任何量测数字。</text>
        <text x="80" y="376" font-size="11.5" fill="#666d75">地板只约束无损压缩；允许失真之后极限由另一组条件决定，见本站率失真理论页。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>