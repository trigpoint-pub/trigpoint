<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="资讯量与机率的关系示意：机率越低资讯量越高，必然事件的资讯量为零；右侧说明取对数是为了让独立事件的资讯量可以相加">
      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">越不可能的事，发生时说得越多</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Shannon (1948) · Samson (1951)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <rect x="40" y="62" width="404" height="200" rx="4" fill="#ffffff" stroke="#dee2e6"/>
        <line x1="88" y1="232" x2="412" y2="232" stroke="#ced4da" stroke-width="1"/>
        <line x1="88" y1="86" x2="88" y2="232" stroke="#ced4da" stroke-width="1"/>
    
        <path d="M100 92 Q140 190 208 216 T400 231" stroke="#495057" stroke-width="2" fill="none"/>
    
        <circle cx="400" cy="231" r="4" fill="#8a5a00"/>
        <text x="392" y="216" text-anchor="end" font-size="11" fill="#8a5a00">必然发生：没有资讯</text>
    
        <circle cx="104" cy="98" r="4" fill="#8a5a00"/>
        <text x="118" y="100" font-size="11" fill="#8a5a00">几乎不可能：资讯量最大</text>
    
        <text x="76" y="94" text-anchor="end" font-size="11" fill="#666d75">资讯量</text>
        <text x="100" y="252" font-size="11" fill="#666d75">机率低</text>
        <text x="412" y="252" text-anchor="end" font-size="11" fill="#666d75">机率高</text>
    
        <rect x="460" y="62" width="220" height="98" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="570" y="88" text-anchor="middle" fill="#495057" font-weight="600">为什么要取对数</text>
        <text x="570" y="112" text-anchor="middle" font-size="11.5" fill="#495057">两件独立的事，机率相乘</text>
        <text x="570" y="130" text-anchor="middle" font-size="11.5" fill="#495057">但资讯量应该相加</text>
        <text x="570" y="150" text-anchor="middle" font-size="11" fill="#666d75">对数把乘法变加法</text>
    
        <rect x="460" y="172" width="220" height="90" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="570" y="198" text-anchor="middle" fill="#8a5a00" font-weight="600">机率是谁的机率</text>
        <text x="570" y="222" text-anchor="middle" font-size="11.5" fill="#8a5a00">同一句话对内行人资讯量低</text>
        <text x="570" y="240" text-anchor="middle" font-size="11.5" fill="#8a5a00">对局外人资讯量高</text>
        <text x="570" y="256" text-anchor="middle" font-size="11" fill="#8a5a00">先讲清楚是谁的预期</text>
    
        <rect x="40" y="278" width="640" height="42" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="360" y="304" text-anchor="middle" font-size="11.5" fill="#495057">量见于 1948 但未命名 · 术语造词归 1951 那份报告 · 1961 那本书是推广者 · 另一英文称法首用未明</text>
    
        <line x1="80" y1="340" x2="640" y2="340" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="360" font-size="11.5" fill="#666d75">曲线仅示形状与方向，刻意无数值刻度、无单位、无座标值。</text>
        <text x="80" y="378" font-size="11.5" fill="#666d75">1951 年那份报告未读到原文，字样本身未能逐字核对；归属依后续文献：方向可信，逐字证据未取得。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>