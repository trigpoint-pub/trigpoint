<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两把尺的四格对照：横轴为统计上的随机程度，纵轴为演算法上的生成难度；右下格为两尺分歧最大处，通过随机检定却可由极短程式生成">
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

      <text x="24" y="34" font-family="Inter,'Noto Sans TC',sans-serif" font-size="17" font-weight="600" fill="#212529">两把尺量的不是同一件事</text>
      <text x="696" y="34" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" font-style="italic" fill="#666d75">Solomonoff (1964) · Kolmogorov (1965) · Chaitin (1966)</text>
      <line x1="24" y1="46" x2="696" y2="46" stroke="#dee2e6" stroke-width="1"/>
      <g font-family="Inter,'Noto Sans TC',sans-serif" font-size="12.5">
    
        <text x="60" y="76" font-size="11" fill="#666d75">演算法上难生成</text>
        <text x="60" y="272" font-size="11" fill="#666d75">演算法上易生成</text>
        <line x1="52" y1="86" x2="52" y2="258" stroke="#ced4da" stroke-width="1"/>
        <line x1="52" y1="258" x2="500" y2="258" stroke="#ced4da" stroke-width="1"/>
        <text x="64" y="290" font-size="11" fill="#666d75">统计上有结构</text>
        <text x="500" y="290" text-anchor="end" font-size="11" fill="#666d75">统计上像随机</text>
    
        <rect x="64" y="86" width="204" height="80" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="166" y="112" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">有规律又难生成</text>
        <text x="166" y="134" text-anchor="middle" font-size="11" fill="#666d75">两把尺都给中等偏高</text>
        <text x="166" y="152" text-anchor="middle" font-size="11" fill="#666d75">多数真实资料落在这里</text>
    
        <rect x="284" y="86" width="204" height="80" rx="4" fill="#fdf3e0" stroke="#ecd3a8"/>
        <text x="386" y="112" text-anchor="middle" font-size="11.5" fill="#8a5a00" font-weight="600">真正无结构</text>
        <text x="386" y="134" text-anchor="middle" font-size="11" fill="#8a5a00">没有比自己更短的描述</text>
        <text x="386" y="152" text-anchor="middle" font-size="11" fill="#8a5a00">这才是本路线说的随机</text>
    
        <rect x="64" y="178" width="204" height="80" rx="4" fill="#ffffff" stroke="#e9ecef"/>
        <text x="166" y="204" text-anchor="middle" font-size="11.5" fill="#495057" font-weight="600">高度重复的内容</text>
        <text x="166" y="226" text-anchor="middle" font-size="11" fill="#666d75">两把尺都给低分</text>
        <text x="166" y="244" text-anchor="middle" font-size="11" fill="#666d75">压缩得很彻底</text>
    
        <rect x="284" y="178" width="204" height="80" rx="4" fill="#f8f9fa" stroke="#8a5a00"/>
        <text x="386" y="200" text-anchor="middle" font-size="11.5" fill="#8a5a00" font-weight="600">两尺分歧最大处</text>
        <text x="386" y="220" text-anchor="middle" font-size="11" fill="#495057">通过标准随机性检定</text>
        <text x="386" y="238" text-anchor="middle" font-size="11" fill="#495057">却由一个极短的程式生成</text>
        <text x="386" y="254" text-anchor="middle" font-size="11" fill="#666d75">两把尺都没有错</text>
    
        <rect x="516" y="86" width="164" height="172" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
        <text x="598" y="112" text-anchor="middle" fill="#495057" font-weight="600">三条独立线</text>
        <line x1="536" y1="126" x2="660" y2="126" stroke="#dee2e6" stroke-width="1"/>
        <text x="598" y="150" text-anchor="middle" font-size="11.5" fill="#495057">通用先验与归纳 1964</text>
        <text x="598" y="174" text-anchor="middle" font-size="11.5" fill="#495057">个体字串复杂度 1965</text>
        <text x="598" y="198" text-anchor="middle" font-size="11.5" fill="#495057">算法随机性 1966</text>
        <line x1="536" y1="214" x2="660" y2="214" stroke="#dee2e6" stroke-width="1"/>
        <text x="598" y="236" text-anchor="middle" font-size="11" fill="#666d75">压成单一人名会抹去</text>
        <text x="598" y="252" text-anchor="middle" font-size="11" fill="#666d75">最早那位与并行史</text>
    
        <line x1="80" y1="304" x2="640" y2="304" stroke="#eceff1" stroke-width="1"/>
        <text x="80" y="324" font-size="11.5" fill="#666d75">四格为概念定位示意，不含座标值、比例或任何量测数字。</text>
        <text x="80" y="342" font-size="11.5" fill="#666d75">本页的量不可计算，只能从上方逼近：压缩率是它的上界估计，不是它的量测值。</text>
        <text x="80" y="360" font-size="11.5" fill="#666d75">两把尺的收敛结论成立于遍历条件之下，该条件为载重前提，不是可省略的技术细节。</text>
        <text x="696" y="392" text-anchor="end" font-size="10.5" fill="#666d75">图：trigpoint.pub</text>
      </g>
    </svg>